schema_version: 3
id: file_summarizer
name: File Summarizer
version: 0.1.0
status: active
visibility: hidden
domain: general
stability: experimental
support: project
description: Teaching example for file inspection, caller-reviewed summaries, and verdicts.
permissions:
  - id: project_files
    reason: Reads text files selected by the caller.
documentation:
  kind: skill
  path: docs/SKILL.md
agent:
  purpose: Demonstrates separate actions for reading text, validating a caller-produced summary, and recording a verdict after the caller has reviewed the summary.
  normal_entrypoints:
    - file_summarizer.inspect_text
    - file_summarizer.accept_summary
    - file_summarizer.write_verdict
actions:
  inspect_text:
    name: Inspect Text
    version: "1.0"
    description: Read a UTF-8 text file and return its text for caller review.
    invocation:
      kind: python
      path: actions/inspect_text.py
      function: run
    inputs:
      - name: source
        type: path
        required: true
        description: Text file to read.
    outputs:
      type: object
      properties:
        text: {type: string}
  accept_summary:
    name: Accept Summary
    version: "1.0"
    description: Validate summary counts against source text and return the caller-authored notes with those counts.
    invocation:
      kind: python
      path: actions/accept_summary.py
      function: run
    inputs:
      - name: text
        type: string
        required: true
        description: Text returned by file_summarizer.inspect_text.
      - name: summary
        type: json
        required: true
        description: Caller-authored summary containing line_count, word_count, char_count, and notes.
    outputs:
      type: object
      properties:
        line_count: {type: integer}
        word_count: {type: integer}
        char_count: {type: integer}
        notes: {type: string}
  write_verdict:
    name: Write Verdict
    version: "1.0"
    description: Return a deterministic threshold verdict or preserve a caller-provided judgment after summary review.
    invocation:
      kind: python
      path: actions/write_verdict.py
      function: run
    inputs:
      - name: summary
        type: json
        required: true
        description: Accepted summary returned by file_summarizer.accept_summary.
      - name: judgment
        type: string
        required: false
        description: Optional caller-authored verdict after reviewing the accepted summary.
    outputs:
      type: object
      properties:
        verdict: {type: string}
    resources:
      - kind: implementation
        path: actions/write_verdict.py
      - kind: documentation
        path: actions/write_verdict/STAGE.md
