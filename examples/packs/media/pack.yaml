schema_version: 3
id: media
name: Media Production Pack
version: 0.1.0
status: active
domain: media
stability: experimental
support: project
description: A teaching pack for declared media actions, composition, schemas, and rendering resources.
keywords: [media, video, trailer, remotion]
permissions:
  - id: subprocess
    reason: Demonstrates local asset processing through declared action implementations.
  - id: project_files
    reason: Reads source assets and writes production artifacts.
documentation:
  kind: skill
  path: docs/SKILL.md
agent:
  purpose: Demonstrates a media pack with a public ingestion action, a composed trailer action, a JSON Schema, and a Remotion effect resource.
  normal_entrypoints:
    - media.ingest_assets
    - media.make_trailer
actions:
  ingest_assets:
    name: Ingest Assets
    version: "1.0"
    description: List files in a source directory and return a stable asset manifest.
    invocation:
      kind: python
      path: actions/ingest_assets.py
      function: run
    inputs:
      - name: source
        type: string
        required: true
        description: Path to a directory containing media assets.
    outputs:
      type: object
      properties:
        file_count: {type: integer}
        assets: {type: array, items: {type: string}}
  make_trailer:
    name: Make Trailer
    version: "1.0"
    description: Compose asset ingestion with a brief into a trailer build manifest.
    invocation:
      kind: python
      path: actions/make_trailer.py
      function: run
    inputs:
      - name: source
        type: string
        required: true
        description: Path to the source directory of media assets.
      - name: brief
        type: string
        required: false
        description: Optional creative brief text.
    outputs:
      type: object
      properties:
        asset_manifest: {type: object}
        trailer_manifest: {type: string}
    graph:
      child_actions: [media.ingest_assets]
      child_orchestrators: []
    resources:
      - kind: implementation
        path: actions/make_trailer.py
      - kind: documentation
        path: actions/make_trailer/STAGE.md
resources:
  - kind: schema
    path: schemas/brief.schema.json
  - kind: template
    path: examples/minimal/brief_input.json
rendering:
  effects/project-title-card:
    type: element
    path: rendering/elements/effects/project-title-card/element.yaml
    resources:
      - kind: implementation
        path: rendering/elements/effects/project-title-card/component.tsx
