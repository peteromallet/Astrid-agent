schema_version: 3
id: minimal
name: Minimal Example Pack
version: 0.1.0
description: The smallest composed external action pack used to teach v3 authoring.
domain: general
stability: experimental
support: project
documentation:
  kind: skill
  path: docs/SKILL.md
agent:
  purpose: Demonstrates one simple action and one composed action in the smallest useful external pack.
  normal_entrypoints:
    - minimal.ingest_assets
    - minimal.make_trailer
actions:
  ingest_assets:
    name: Ingest Assets
    version: "1.0"
    description: List the entries in a source directory and return an asset manifest.
    invocation:
      kind: python
      path: actions/ingest_assets.py
      function: run
    inputs:
      - name: source
        type: string
        required: false
        default: .
        description: Directory to list; defaults to the current working directory.
    outputs:
      type: object
      properties:
        item_count: {type: integer}
        assets: {type: array, items: {type: string}}
  make_trailer:
    name: Make Trailer
    version: "1.0"
    description: Compose asset ingestion with an optional brief into a trailer manifest.
    invocation:
      kind: python
      path: actions/make_trailer.py
      function: run
    inputs:
      - name: source
        type: string
        required: false
        default: .
        description: Directory to list; defaults to the current working directory.
      - name: brief
        type: string
        required: false
        description: Optional brief text.
    outputs:
      type: object
      properties:
        asset_manifest: {type: object}
        trailer_manifest: {type: string}
    graph:
      child_actions: [minimal.ingest_assets]
      child_orchestrators: []
