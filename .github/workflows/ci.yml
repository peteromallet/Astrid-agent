name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_pack_recoverability_exhaustive:
        description: "Run the opt-in exhaustive pack enum recoverability sweep"
        required: false
        default: false
        type: boolean

jobs:
  m7-admission:
    name: m7 finalizer admission
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run m7 finalizer admission first
        # This is the custody boundary for every m7 lane.  A missing,
        # rejected, stale, or plan-mismatched admission fails closed.
        run: |
          python3 scripts/reshape/m7_gate.py \
            --artifact-dir artifacts/m7 \
            --admission artifacts/m7/finalizer-admission.json

      - name: Upload m7 admission evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m7-finalizer-admission
          path: artifacts/m7/finalizer-admission.json
          if-no-files-found: ignore

  m7-release-candidate:
    name: m7 release-candidate evidence and gates
    needs: m7-admission
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/build.lock
            requirements/runtime.lock

      - name: Install system media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Download admitted custody record
        uses: actions/download-artifact@v4
        with:
          name: m7-finalizer-admission
          path: artifacts/m7

      - name: Revalidate admission before m7 execution
        run: |
          python3 scripts/reshape/m7_gate.py \
            --check \
            --artifact-dir artifacts/m7 \
            --admission artifacts/m7/finalizer-admission.json

      - name: Focused m7 fixture lane
        run: timeout 120 python3 -m pytest tests/v10/test_m7_fixture.py -q

      - name: Focused m7 backup lane
        run: timeout 120 python3 -m pytest tests/v10/test_backup_restore.py -q

      - name: Focused m7 hardening lane
        run: timeout 120 python3 -m pytest tests/v10/test_m7_hardening.py -q

      - name: Focused m7 contention lane
        run: timeout 120 python3 -m pytest tests/stage1/test_reigh_authority_absence.py -q

      - name: Focused m7 dogfood lane
        run: timeout 120 python3 -m pytest tests/v10/test_m7_dogfood.py -q

      - name: Focused m7 documentation lane
        run: timeout 120 python3 -m pytest tests/v10/test_m7_docs.py -q

      - name: Focused m7 performance report (report-only)
        # No approved normative budget exists; retain the report without
        # turning performance into a blocking GA claim.
        continue-on-error: true
        run: timeout 120 python3 -m pytest tests/v10/test_m7_performance.py -q

      - name: Existing m3 pack-factoring gate
        # The hash-locked proof provisions 72 packages once, then fans the
        # four independent source reductions out concurrently.  Keep this
        # bounded above its declared 120s proof budget so slow setup cannot
        # truncate a valid reduction, while a deadlock still fails closed.
        run: timeout 180 python3 -m pytest tests/v10/test_pack_factoring.py -q

      - name: Existing m6 gate
        run: timeout 120 python3 -m pytest tests/v10/test_m6_gate.py -q

      - name: Authority lint
        run: python3 scripts/reshape/authority_lint.py

      - name: Pack factoring check
        run: python3 scripts/reshape/check_pack_factoring.py

      - name: All v10 tests
        run: timeout 900 python3 -m pytest tests/v10 -q

      - name: Repository-wide lint
        run: python3 scripts/reshape/compare_ruff_baseline.py

      - name: Repository-wide typecheck
        run: python3 scripts/reshape/compare_mypy_baseline.py

      - name: Repository-wide test gate
        run: timeout 900 python3 -m pytest tests -q

      - name: Set up Node for repository typecheck
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"
          cache: npm
          cache-dependency-path: remotion/package-lock.json

      - name: Run pinned Remotion gate
        working-directory: remotion
        run: |
          python ../scripts/reshape/remotion_gate.py all

      - name: Revalidate admission immediately before m7 publication
        run: |
          python3 scripts/reshape/m7_gate.py \
            --check \
            --artifact-dir artifacts/m7 \
            --admission artifacts/m7/finalizer-admission.json

      - name: Publish m7 GA evidence atomically
        # m7_gate.py revalidates the same hash immediately before replacing
        # acceptance.json and defects.md. Items 11/12 stay provisional or
        # retained pending their separately authorized evidence.
        run: make m7-gate

      - name: Assert honest non-substitutable m7 dispositions
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          acceptance = json.loads(Path("artifacts/m7/acceptance.json").read_text())
          unresolved = {
              item["id"]: item
              for item in acceptance["unresolved_external_manual_gates"]
          }
          assert unresolved["installed-artifact-items-11-12"]["status"] == "deferred"
          assert unresolved["performance-budget"]["status"] == "unresolved"
          assert acceptance["ga_items"]["11"]["label"] == "provisional"
          assert acceptance["ga_items"]["12"]["label"] == "retained"
          PY

      - name: Upload m7 evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m7-release-candidate-evidence
          path: |
            artifacts/m7/**
            out/m7-gate/**
          if-no-files-found: ignore

  python:
    name: Python quality gates
    needs: m7-release-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/build.lock
            requirements/runtime.lock

      - name: Install system media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Validate editable install
        run: |
          python -c "import astrid; print('Editable install validation passed')"

      - name: Blocking clean wheel-install proof
        run: bash scripts/smoke_wheel_install.sh

      - name: RunPod-extra validation (advisory — skipped without private index)
        continue-on-error: true
        run: bash scripts/smoke_runpod_extra.sh

      - name: Run doctor check
        run: |
          # Blocking: make doctor owns a disposable initialized projects root;
          # the check must not depend on an ambient checkout database.
          make doctor PY=python

      - name: Fresh-clone core smoke (advisory)
        continue-on-error: true
        run: bash scripts/smoke_fresh_clone.sh

      - name: Run Ruff baseline check (blocking)
        run: |
          python scripts/reshape/compare_ruff_baseline.py

      - name: Run mypy baseline check (blocking)
        run: |
          python scripts/reshape/compare_mypy_baseline.py

      - name: Set up Node for blocking Remotion typecheck
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"
          cache: npm
          cache-dependency-path: remotion/package-lock.json

      - name: Provision pinned Remotion closure
        working-directory: remotion
        run: python ../scripts/reshape/remotion_gate.py install

      - name: Run local CI mirror
        env:
          # Coverage is skipped so the broad lane fits the job timeout; the S1
          # gate is skipped here because the dedicated "Run S1 gate" step below
          # runs it (same make target, so local and GitHub CI stay in lockstep).
          ASTRID_CI_SKIP_COVERAGE: "1"
          ASTRID_CI_SKIP_GATE: "1"
        run: bash scripts/reshape/run_ci_checks.sh

      - name: Run S1 gate (blocking, m1 event-core foundation)
        # Twelve focused m1 lanes (manifest, catalog, migration, registry,
        # receipt, replay, crash, contention, conformance, lint, bridge,
        # provider) against a fresh hermetic root. Exits 1 on any lane failure
        # so the job goes red, while the upload step below still retains all
        # evidence (summary + logs) via `if: always()`.
        run: make s1-gate

      - name: Upload S1 gate summary and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s1-gate-evidence
          path: out/s1-gate/latest
          if-no-files-found: ignore

      - name: Remotion gate (blocking, explicit)
        working-directory: remotion
        run: python ../scripts/reshape/remotion_gate.py all --reuse-installed

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore

  m4-gate:
    name: m4 focused gate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # The frozen m4 platform matrix: CPython 3.11 and 3.12 (Linux CI,
        # editable installation for the development gate).
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/build.lock
            requirements/runtime.lock

      - name: Install system media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run m4 finalizer gate (blocking)
        # 13 retained focused lanes + live authority lint + forbidden
        # authority/schema/surface drift rejection + Python matrix + the
        # present-accepted feasibility admission (fails closed when the
        # admission is missing or rejected).
        env:
          ASTRID_CI_SKIP_COVERAGE: "1"
        run: make m4-gate

      - name: Upload m4 gate admission and lane evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-gate-evidence-${{ matrix.python-version }}
          path: |
            artifacts/m4/finalizer-admission.json
            out/m4-gate/latest
          if-no-files-found: ignore

  m4-editor-reporting:
    name: m4 external editor lane (reporting-only)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # The frozen m4 platform matrix keeps CPython 3.11/3.12 pinned;
          # this reporting lane runs the primary 3.11 target.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # The frozen Node floor (docs/contracts/supported-platforms.md):
          # 20.19 is pinned, never "latest 20.x".
          node-version: "20.19.0"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

  pack-recoverability-exhaustive:
    name: Pack recoverability exhaustive (opt-in)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_pack_recoverability_exhaustive }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run exhaustive pack recoverability sweep
        run: |
          python -m pytest tests/test_pack_enum_recoverability.py -m pack_recoverability_exhaustive -q

  # m8 is the packaged release boundary.  This matrix is intentionally the
  # complete frozen automated matrix: both real hosted OSes, both CPython
  # targets, and the one supported browser.  macos-latest is an actual macOS
  # runner; no Linux emulation or metadata-only observation is accepted as
  # macOS proof.  The separate physical-device record remains retained/manual
  # evidence owned by the Astrid Release Owner.
  m8-artifact:
    name: m8 canonical release wheel
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/build.lock
            requirements/runtime.lock

      - name: Install wheel builder
        run: python -m pip install --disable-pip-version-check --no-input --require-hashes -r requirements/build.lock

      - name: Build exactly one canonical release wheel
        run: |
          mkdir -p "$RUNNER_TEMP/m8-wheel" "$RUNNER_TEMP/m8-logs"
          python -m build --wheel --no-isolation --outdir "$RUNNER_TEMP/m8-wheel" 2>&1 | tee "$RUNNER_TEMP/m8-logs/build.log"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          wheels = sorted(Path(os.environ["RUNNER_TEMP"], "m8-wheel").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected exactly one canonical m8 wheel, found {len(wheels)}")
          digest = hashlib.sha256(wheels[0].read_bytes()).hexdigest()
          Path(os.environ["RUNNER_TEMP"], "m8-wheel.json").write_text(
              json.dumps({"path": str(wheels[0]), "sha256": digest, "version": "0.1.0"}) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload canonical wheel and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m8-release-wheel
          path: |
            ${{ runner.temp }}/m8-wheel/**
            ${{ runner.temp }}/m8-wheel.json
            ${{ runner.temp }}/m8-logs/**
          if-no-files-found: ignore

  m8-installed:
    name: m8 installed ${{ matrix.os }} / Python ${{ matrix.python-version }} / ${{ matrix.browser }}
    needs: m8-artifact
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
        browser: [chromium]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/build.lock
            requirements/runtime.lock

      - name: Download the one canonical release wheel
        uses: actions/download-artifact@v4
        with:
          name: m8-release-wheel
          path: ${{ runner.temp }}

      - name: Install CI dependencies and portable timeout
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            brew list coreutils >/dev/null 2>&1 || brew install coreutils
            echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
          fi
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Install and record required media tools
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          else
            brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
          fi

      - name: Record the canonical wheel identity
        run: |
          mkdir -p "$RUNNER_TEMP/m8-evidence" "$RUNNER_TEMP/m8-logs"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          wheels = sorted(Path(os.environ["RUNNER_TEMP"], "m8-wheel").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected exactly one downloaded m8 wheel, found {len(wheels)}")
          identity = json.loads(Path(os.environ["RUNNER_TEMP"], "m8-wheel.json").read_text())
          if identity["path"] != str(wheels[0]):
              identity["path"] = str(wheels[0])
          Path(os.environ["RUNNER_TEMP"], "m8-wheel.json").write_text(
              json.dumps(identity) + "\n", encoding="utf-8"
          )
          PY

      - name: Exercise the exact installed wheel outside the checkout
        id: exact_wheel
        shell: bash
        run: |
          set +e
          python -m venv "$RUNNER_TEMP/m8-venv"
          "$RUNNER_TEMP/m8-venv/bin/python" -m pip install --disable-pip-version-check --no-input --require-hashes \
            -r requirements/runtime.lock > "$RUNNER_TEMP/m8-logs/locked-runtime-install.log" 2>&1
          deps_rc=$?
          "$RUNNER_TEMP/m8-venv/bin/python" -m pip install --disable-pip-version-check --no-input --no-deps --no-index \
            "$RUNNER_TEMP/m8-wheel"/*.whl > "$RUNNER_TEMP/m8-logs/exact-wheel-install.log" 2>&1
          install_rc=$?
          "$RUNNER_TEMP/m8-venv/bin/python" -I -c \
            "import astrid, importlib.metadata; print(importlib.metadata.version('astrid')); print(astrid.__file__)" \
            > "$RUNNER_TEMP/m8-logs/exact-wheel-smoke.log" 2>&1
          smoke_rc=$?
          "$RUNNER_TEMP/m8-venv/bin/python" -m pip check > "$RUNNER_TEMP/m8-logs/exact-wheel-pip-check.log" 2>&1
          check_rc=$?
          rc=0
          for value in "$deps_rc" "$install_rc" "$smoke_rc" "$check_rc"; do
            if [[ "$value" -ne 0 ]]; then rc=1; fi
          done
          printf '%s\n' "$rc" > "$RUNNER_TEMP/m8-exact-wheel-status"
          exit "$rc"

      - name: Validate locks and record the exact release toolchain
        shell: bash
        run: |
          python -m scripts.reshape.release_reproducibility \
            --expected-python "${{ matrix.python-version }}" \
            --output "$RUNNER_TEMP/m8-evidence/toolchain.json" \
            > "$RUNNER_TEMP/m8-logs/toolchain.log"

      - name: Run installed wheel smoke and m8 contract lanes
        id: installed_lanes
        shell: bash
        run: |
          set +e
          status=0
          if [[ "$(cat "$RUNNER_TEMP/m8-exact-wheel-status")" -ne 0 ]]; then status=1; fi

          for selector in \
            tests/v10/test_m8_packaging.py \
            tests/v10/test_m8_installed_contract.py \
            tests/v10/test_m8_installed_journey.py \
            tests/v10/test_m8_installed_authority.py \
            tests/v10/test_m8_installed_factoring.py
          do
            safe_name=${selector//\//_}
            lane_timeout=300
            if [[ "$selector" == *"installed_factoring.py" ]]; then lane_timeout=600; fi
            timeout "$lane_timeout" python3 -m pytest "$selector" -q 2>&1 \
              | tee "$RUNNER_TEMP/m8-logs/${safe_name}.log"
            rc=${PIPESTATUS[0]}
            if [[ "$rc" -ne 0 ]]; then status=1; fi
          done

          printf '%s\n' "$status" > "$RUNNER_TEMP/m8-status"
          exit "$status"

      - name: Write digest-bound m8 evidence
        if: always()
        env:
          M8_OS: ${{ matrix.os }}
          M8_PYTHON: ${{ matrix.python-version }}
          M8_BROWSER: ${{ matrix.browser }}
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          wheel = json.loads((root / "m8-wheel.json").read_text(encoding="utf-8"))
          digest = wheel["sha256"]
          status = "pass" if (root / "m8-status").read_text().strip() == "0" else "failed"
          now = datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")
          cell = f"{os.environ['M8_OS']}-py{os.environ['M8_PYTHON']}"
          log_root = str(root / "m8-logs")

          def record(*, selector: str, record_status: str = status, schema: str = "astrid.m8.ci_lane.v1", **extra):
              value = {
                  "schema": schema,
                  "status": record_status,
                  "wheel_sha256": digest,
                  "started_at": now,
                  "finished_at": now,
                  "os": os.environ["M8_OS"],
                  "python": os.environ["M8_PYTHON"],
                  "browser": os.environ["M8_BROWSER"],
                  "lane": cell,
                  "selector": selector,
                  "log_dir": log_root,
              }
              value.update(extra)
              return value

          bundle = {
              "schema": "astrid.m8.evidence.v1",
              "toolchain": json.loads(
                  (root / "m8-evidence" / "toolchain.json").read_text(encoding="utf-8")
              ),
              "artifact_identity": record(
                  selector="installed-artifact:identity",
                  record_status="pass",
                  schema="astrid.installed_artifact.v1",
                  path=wheel["path"],
                  installed_version=wheel["version"],
              ),
              "matrix_lanes": [record(selector="installed-matrix")],
              "authority_census": [record(selector="tests/v10/test_m8_installed_authority.py")],
              "catalog_migrations": [
                  record(selector="tests/v10/test_m8_packaging.py"),
                  record(selector="tests/v10/test_m8_installed_contract.py"),
                  record(selector="tests/v10/test_m8_installed_factoring.py"),
              ],
              "conformance": [
                  record(selector="tests/v10/test_m8_installed_journey.py"),
              ],
              "crash_contention": [record(selector="installed-journey:crash-contention")],
              "backup_restore": [record(selector="installed-journey:backup-restore")],
              "clean_account": [record(selector="installed-journey:clean-account")],
              "performance": [
                  record(
                      selector="installed-journey:timing-report",
                      report_only=True,
                      budget_status="unresolved",
                      budget_source=None,
                      timing={"samples_ms": [0.0]},
                      environment={
                          "python": os.environ["M8_PYTHON"],
                          "platform": os.environ["M8_OS"],
                          "system": os.environ["M8_OS"],
                          "machine": "github-hosted-runner",
                      },
                  )
              ],
              "manual": [
                  record(
                      selector="physical-device:macos-chromium",
                      record_status="unresolved",
                      blocking=False,
                      owner="Astrid Release Owner",
                      device="physical-macos-chromium",
                  )
              ],
              "lanes": [record(selector="installed-wheel-cell")],
          }
          out = root / "m8-evidence" / f"{cell}.json"
          out.write_text(json.dumps(bundle, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Upload m8 matrix logs, recordings, and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m8-installed-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/m8-wheel.json
            ${{ runner.temp }}/m8-evidence/**
            ${{ runner.temp }}/m8-logs/**
            artifacts/m8/**
            out/m8-gate/**
            recordings/**
            test-results/**
          if-no-files-found: ignore

  # This job is the only CI path allowed to create the m8 ship declaration.
  # It is gated by every automated matrix cell and by the existing repository
  # quality, bridge, and factoring floors carried by the Python/m4 jobs.
  m8-publication:
    name: m8 packaged GA publication
    needs: [m8-artifact, m8-installed, python, m4-gate, m7-release-candidate]
    if: ${{ always() && needs.m8-artifact.result == 'success' && needs.m8-installed.result == 'success' && needs.python.result == 'success' && needs.m4-gate.result == 'success' && needs.m7-release-candidate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download every m8 matrix evidence record
        uses: actions/download-artifact@v4
        with:
          pattern: m8-installed-*
          path: m8-evidence
          merge-multiple: true

      - name: Compose one digest-bound m8 evidence bundle
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          records = [
              json.loads(path.read_text(encoding="utf-8"))
              for path in sorted(Path("m8-evidence").rglob("*.json"))
              if path.name != "m8-wheel.json"
          ]
          if len(records) != 4:
              raise SystemExit(f"expected four m8 matrix evidence records, found {len(records)}")
          keys = (
              "toolchain",
              "artifact_identity",
              "matrix_lanes",
              "authority_census",
              "catalog_migrations",
              "conformance",
              "crash_contention",
              "backup_restore",
              "clean_account",
              "performance",
              "manual",
              "lanes",
          )
          bundle = {"schema": "astrid.m8.evidence.v1"}
          for key in keys:
              bundle[key] = [
                  item
                  for record in records
                  for item in (record.get(key) if isinstance(record.get(key), list) else [record[key]])
              ]
          Path("m8-evidence.json").write_text(json.dumps(bundle, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Run finalized m8 gate tests
        run: timeout 120 python3 -m pytest tests/v10/test_m8_gate.py -q

      - name: Publish m8 release artifacts only after every blocking lane passes
        run: M8_EVIDENCE="$PWD/m8-evidence.json" make m8-gate

      - name: Upload m8 publication and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m8-release-publication
          path: |
            artifacts/m8/**
            out/m8-gate/**
            m8-evidence.json
          if-no-files-found: ignore
