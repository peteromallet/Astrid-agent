[build-system]
requires = ["setuptools==80.9.0", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "astrid"
version = "0.1.0"
description = "A harness toolkit for agents and humans to make art"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.55,<3",
    "scenedetect[opencv-headless]==0.6.4",
    "anthropic>=0.40.0",
    "google-genai>=1.15.0",
    "filelock>=3.13",
    "PyYAML>=6.0",
    "jsonschema>=4.0",
    "referencing>=0.30",
    "pillow>=12.2,<13",
    "fal-client>=0.7.0",
    "xxhash>=3.4",
    "PyJWT[crypto]>=2.8",
    # Supported OS-keychain boundary for the frozen credential precedence
    # (explicit > process env > injectable keychain > named env file). Imported
    # lazily by astrid.core.util.secrets.OSKeychainProvider: domain-only use
    # and tests never access a keychain (no eager keychain access).
    "keyring>=25.0",
    # pyannote.audio is intentionally excluded from core metadata.
    # It is an optional/heavy dependency; install separately if needed.
    # "pyannote.audio==3.3.2",
    #
    # runpod-lifecycle has been moved to [project.optional-dependencies].runpod.
    # It is not published on public PyPI and requires a configured private index
    # or local wheelhouse to resolve.  Install with: pip install 'astrid[runpod]'
    # "runpod-lifecycle>=0.3",
]

[project.scripts]
astrid = "astrid.core.gateway:main"

[project.optional-dependencies]
dev = [
    "mypy==1.17.0",
    "pytest==9.0.2",
    "pytest-cov==7.1.0",
    # The runtime keeps the canonical Banodoco schema optional, but the full
    # development/CI suite must exercise timeline validation against one exact
    # compatible contract instead of an ambient sibling checkout or an older
    # transitive Remotion copy.
    "banodoco-timeline-schema @ git+https://github.com/banodoco/ArtAgents.git@242f9c4306bf3b501222cb041a9eb246ef47bc85#subdirectory=packages/timeline-schema/python",
    # Default per-test timeout for the whole suite (see [tool.pytest.ini_options]
    # timeout/timeout_method below). Converts ANY hanging test into a fast,
    # diagnosable failure with a thread stack dump, so a single wedged test can
    # never wedge the suite for callers (CI, the megaplan baseline capture,
    # humans). This is the architectural guard against the "hung suite" class.
    "pytest-timeout>=2.4",
    # QUIC provider fixtures use the maintained aioquic implementation to
    # prove a real handshake; UDP-shaped payloads are not sufficient evidence.
    "aioquic>=1.2,<2",
    "ruff==0.12.0",
    "build==1.4.0",
    # sisypy backs the migrated tests/agentic/ suite (agentic scenario testing).
    # Private, not on PyPI — installed from its GitHub repo.
    "sisypy @ git+https://github.com/peteromallet/sisypy.git@dfb3fa3",
]

# Requires a configured private package index (e.g. local wheelhouse or git
# source) because runpod-lifecycle is not published on public PyPI.
# Install: pip install 'astrid[runpod]'
runpod = [
    "runpod-lifecycle>=0.3",
]

[tool.setuptools]
# Only the package-data patterns below are release inputs.  In particular,
# do not let setuptools' VCS/egg-info package-data defaults pull authoring
# files from namespace-like directories such as packs/*/golden or packs/*/tests.
include-package-data = false

[tool.setuptools.packages.find]
include = ["astrid*"]
exclude = [
    # Tests are not part of the installed product.  Keeping this exclusion
    # explicit prevents a future in-tree pack test package from becoming a
    # runtime dependency by accident.
    "astrid.*.tests*",
    # Golden provider examples and pack skills are authoring material, not
    # installed runtime modules.
    "astrid.*.golden*",
    "astrid.*.skill*",
    "astrid.skills*",
]

[tool.setuptools.exclude-package-data]
astrid = [
    # Defensive exclusions for non-package directories that may be surfaced
    # by a source/VCS manifest in a future setuptools release.
    "**/__pycache__/*",
    "packs/**/tests/*",
    "packs/**/golden/*",
    "packs/**/skill/*",
    "packs/**/build/*",
]

[tool.setuptools.package-data]
astrid = [
    # Core data consumed through Path(__file__) or importlib.resources.
    # Python modules are discovered above; these patterns deliberately name
    # data formats rather than copying documentation, skills, tests, caches,
    # or build/planning material into the wheel.
    "core/**/*.json",
    "core/**/*.sql",
    "core/**/*.yaml",
    "core/rendering/fixtures/renderer_parity/*",
    "core/rendering/schemas/v1/*.json",

    # Capability manifests and their runtime data.  STAGE.md, skill files,
    # requirements files, golden logs, and other authoring-only material are
    # intentionally not included by these patterns.
    "packs/**/pack.yaml",
    "packs/**/*.yaml",
    "packs/**/*.json",
    "packs/text_analysis/fixtures/*.txt",
    "packs/**/*.html",
    "packs/**/*.css",
    "packs/**/*.js",
    "packs/**/*.ts",
    "packs/**/*.tsx",
    "packs/**/*.ttf",
]

[tool.ruff]
target-version = "py311"
line-length = 100
# Evidence: advisory lint scope was introduced in 7d343bc with only reshape/concurrency paths.
# Inference: astrid/ was left out to keep the initial S0 gate narrow while known backlog remained.
include = [
    "astrid/**/*.py",
    "scripts/reshape/**/*.py",
    "tests/reshape/**/*.py",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "BLE"]

[tool.coverage.run]
source = ["astrid"]
omit = [
    ".megaplan/*",
    "out/*",
    "runs/*",
    ".venv/*",
    "venv/*",
    "*/venv/*",
    "*/.venv/*",
    "remotion/*",
    "tests/*",
    "*/tests/*",
    "scripts/*",
    "*/site-packages/*",
    "node_modules/*",
    "build/*",
    "dist/*",
]

[tool.coverage.report]
show_missing = true
fail_under = 0

[tool.mypy]
python_version = "3.11"
# Evidence: 7d343bc created this config with files = ["scripts/reshape"] alongside the first advisory CI gate.
# Inference: core astrid typing was intentionally excluded at that point rather than accidentally omitted.
files = ["astrid", "scripts/reshape"]
follow_imports = "skip"
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true
pretty = true
show_error_codes = true
warn_unused_configs = true

[tool.pytest.ini_options]
# Passed test sandboxes can contain full wheels, virtualenvs, rendered media,
# and adversarial package copies. Remove each passed tmp_path at teardown so a
# complete suite does not retain gigabytes until session end. Failed sandboxes
# remain available for diagnosis.
tmp_path_retention_policy = "failed"
# --- Suite-wide hang guard (architectural root fix) ---
# A DEFAULT per-test timeout applies to every test in the suite. Any test that
# hangs (spawns a server/subprocess and waits forever, deadlocks, blocks on a
# socket, etc.) is killed at this bound and reported as a failure with a full
# thread stack dump -- instead of wedging the whole `pytest` invocation
# indefinitely. This is what stops one bad test from hanging CI, the megaplan
# `finalize` test-baseline capture, or a human's local run for ~an hour.
#
# 120s is generous: it tolerates the slowest legitimate integration test
# (subprocess/LLM/ffmpeg spawn) while still catching a genuinely wedged
# (infinite) test fast. Override per-test with @pytest.mark.timeout(N) (the
# `timeout` marker is registered below); set timeout(0) to disable for a
# specific deliberately-long test.
#
# timeout_method = "signal": a SIGALRM is delivered to the test on the main
# thread and raised AS A TEST FAILURE, so the hung test is actually ABORTED and
# the suite CONTINUES. This is the property that makes the suite unable to hang.
# (The "thread" method only DUMPS a stack from a watchdog thread; it cannot
# interrupt a blocked call, so a non-daemon hung test can still wedge the whole
# `pytest` process at exit -- which is precisely the failure that wedged the
# megaplan baseline capture for ~an hour. SIGALRM is Unix-only and fires on the
# main thread, which matches how pytest runs tests on CI/macOS/Linux.) A test
# that legitimately runs longer should raise its own bound with
# @pytest.mark.timeout(N), as tests/concurrency/test_ci_sandbox_isolation.py does.
timeout = 120
timeout_method = "signal"
# Scope collection to Astrid's own tests; exclude vendored upstream test trees
# (e.g. any pack's `ai_toolkit/upstream` submodule, which targets the upstream
# project, needs heavy deps like torch, and is not part of Astrid's suite).
testpaths = [
    "tests",
]
norecursedirs = [
    "astrid/packs/*/ai_toolkit/upstream",
    ".claude",
    ".git",
    ".venv",
    "node_modules",
]
markers = [
    "grok_iter: grok-4.6-driven UX iteration loop (opt-in, needs grok CLI)",
    "slow: slower integration-style tests that should remain opt-in for tight loops",
    "performance_smoke: lightweight performance smoke tests with loose CI-safe thresholds",
    "renderer_parity: blocking semantic parity integration for shipped timeline renderers",
    "pack_recoverability_exhaustive: opt-in exhaustive sweep of importable pack enum recoverability surfaces",
    "timeout: per-test timeout marker used when pytest-timeout is installed",
    "standalone: tests intended to run independently from the default suite",
    "hype_cut_invariants: standalone hype cut invariant coverage",
    "integration: tests that require external dependencies, heavyweight fixtures, or env prerequisites",
    "opt_in: tests that are explicitly opt-in and should never run in the default lane",
    "real_arnold: conformance tests that require a real Arnold installation and are skipped otherwise",
    "live: opt-in VLM live-gate tests that require real provider credentials and never run in default CI",
    "hermetic: deterministic credential-free tests that run in the default CI selection",
]
