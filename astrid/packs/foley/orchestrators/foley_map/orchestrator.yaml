{
  "schema_version": 1,
  "cache": {
    "mode": "none"
  },
  "child_executors": [
    "foley.tile_video",
    "understanding.visual_understand",
    "fal.fal_foley",
    "foley.foley_review"
  ],
  "child_orchestrators": [],
  "description": "Spatial Foley pipeline: tile a video, ask a VLM for a global scene description and per-tile prompts, and score each tile via fal Hunyuan-Foley.",
  "id": "foley.foley_map",
  "isolation": {
    "mode": "subprocess",
    "network": true
  },
  "keywords": [
    "foley",
    "audio",
    "video",
    "spatial",
    "tile",
    "vlm",
    "viewer"
  ],
  "kind": "built_in",
  "metadata": {
    "env": [
      "FAL_KEY",
      "OPENAI_API_KEY"
    ],
    "runtime_entrypoint": "main",
    "runtime_file": "run.py",
    "runtime_module": "astrid.packs.foley.orchestrators.foley_map.run"
  ,
    "network_policy": {"allowed_protocols":["dns","tcp"],"allowed_destinations":["api.openai.com:443","queue.fal.run:443","fal.run:443","storage.fal.run:443"],"allow_redirects":false}},
  "name": "Foley Map",
  "runtime": {
    "command": {
      "argv": [
        "{python_exec}",
        "-m",
        "astrid.packs.foley.orchestrators.foley_map.run",
        "{orchestrator_args}"
      ]
    },
    "kind": "command"
  },
  "scoped_configs": ["credentials.fal"],
  "short_description": "Spatial Foley pipeline: tile a video, prompt a VLM, and score Foley per tile.",
  "version": "0.1"
}
