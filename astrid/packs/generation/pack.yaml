schema_version: 2
id: generation
name: Astrid Generation
version: 1.0.0
status: active
domain: generation
stability: stable
support: core
visibility: visible
permissions:
  - id: subprocess
    reason: Runs vibecomfy and ComfyUI locally for image and video generation.
  - id: network
    reason: Calls fal.ai cloud API and downloads models for cloud backends; streams Edge TTS speech from Microsoft's online speech service.
    services:
      - speech.platform.bing.com
  - id: project_files
    reason: Reads reference images and prompt files; writes generated outputs.
  - id: environment
    reason: Reads FAL_KEY for cloud generation backends.
description: Text-to-image, text-to-video and text-to-speech generation across local (vibecomfy/ComfyUI) and cloud (fal, OpenAI, Edge TTS) backends, with t2i/i2i/edit, t2v/i2v/flf and exact-text voiceover modes.
keywords: [image, video, generate, flux, fal, vibecomfy, t2i, t2v, speech, voiceover, tts, edge-tts]
capabilities: [generate_image, generate_image_cloud_i2i, generate_image_edit, generate_image_upscale, generate_image_openai, generate_video, generate_audio, generate_speech]
extensions:
  generation:
    features:
      - id: mask_ref
        label: Mask reference
        description: Typed CAS-backed image mask used by bounded image inpainting.
agent:
  purpose: "Use to synthesize new image or video frames from text prompts (optionally with reference images), choosing a model and a local or cloud execution backend."
  do_not_use_for: "Editing/arranging existing footage (use video_editing for end-to-end assembly or editorial for analysis stages), Foley/sound-effect or music generation (use the foley or fal packs), or lossless clip trimming (use the media pack). For exact-text narration use generation.generate_speech (or generation.generate_audio with mode tts, which routes there)."
  normal_entrypoints: [generation.generate_image, generation.generate_image_upscale, generation.generate_video, generation.generate_image_openai, generation.generate_audio, generation.generate_speech]
content:
  executors: executors
documentation:
  kind: skill
  path: skill/SKILL.md
dependencies:
  python: ["edge-tts>=7.2,<8"]
  system: [ffmpeg, ffprobe]
