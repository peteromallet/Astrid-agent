schema_version: 2
id: generation
name: Astrid Generation
version: 1.0.0
status: active
domain: generation
stability: stable
support: core
visibility: visible
permissions:
  - id: subprocess
    reason: Runs vibecomfy/ComfyUI plus Edge TTS, ffmpeg, and ffprobe generation tools.
  - id: network
    reason: Calls cloud generation APIs, the Edge TTS speech service, and model downloads.
  - id: project_files
    reason: Reads reference images and prompt files; writes generated outputs.
  - id: environment
    reason: Reads FAL_KEY for cloud generation backends.
description: Text-to-image and text-to-video generation across local (vibecomfy/ComfyUI) and cloud (fal, OpenAI) backends, with t2i/i2i/edit and t2v/i2v/flf modes.
keywords: [image, video, generate, flux, fal, vibecomfy, t2i, t2v]
capabilities: [generate_image, generate_image_cloud_i2i, generate_image_edit, generate_image_upscale, generate_image_openai, generate_video, generate_audio, generate_speech]
extensions:
  generation:
    features:
      - id: mask_ref
        label: Mask reference
        description: Typed CAS-backed image mask used by bounded image inpainting.
agent:
  purpose: "Use to synthesize images, video, music, or spoken text from prompts (optionally with reference images), choosing a model and a local or cloud execution backend."
  do_not_use_for: "Editing/arranging existing footage (use video_editing for end-to-end assembly or editorial for analysis stages), Spatial Foley effects (use the foley or fal packs), or lossless clip trimming (use the media pack)."
  normal_entrypoints: [generation.generate_image, generation.generate_image_upscale, generation.generate_video, generation.generate_image_openai, generation.generate_audio, generation.generate_speech]
content:
  executors: executors
documentation:
  kind: skill
  path: skill/SKILL.md
