{
  "schema_version": 1,
  "cache": {
    "mode": "none"
  },
  "command": {
    "argv": [
      "{python_exec}",
      "-m",
      "astrid.packs.generation.executors.generate_image.run",
      "--model",
      "{model}",
      "--mode",
      "{mode}",
      "--execution",
      "{execution}",
      "--storage-policy-version",
      "astrid.cloud-t2i.registry.v1",
      "--size",
      "{size}",
      "--out",
      "{out}"
    ]
  },
  "conditions": [
    {
      "input": "model",
      "kind": "requires_input"
    },
    {
      "input": "mode",
      "kind": "requires_input"
    },
    {
      "input": "execution",
      "kind": "requires_input"
    }
  ],
  "description": "Generate up to four cloud text-to-image outputs through the model registry under an enforced whole-task storage envelope.",
  "graph": {
    "consumes": [
      "prompt_or_prompts_file",
      "image_ref"
    ],
    "provides": [
      "generated_images",
      "image_manifest"
    ]
  },
  "id": "generation.generate_image",
  "inputs": [
    {
      "description": "Generation mode: t2i (text-to-image), i2i (image-to-image), edit (instruction-guided edit). Required per SD-005.",
      "name": "mode",
      "required": true,
      "type": "string"
    },
    {
      "default": "",
      "description": "Text prompt for image generation (mutually exclusive with prompts_file).",
      "name": "prompt",
      "required": false,
      "type": "string",
      "artifact_type": "prompt"
    },
    {
      "default": "",
      "description": "JSON/JSONL file of prompts (mutually exclusive with prompt).",
      "name": "prompts_file",
      "required": false,
      "type": "file",
      "artifact_type": "prompt"
    },
    {
      "description": "Model ID from the generation model registry (e.g. 'flux-dev', 'z-image').",
      "name": "model",
      "required": true,
      "type": "string"
    },
    {
      "default": "",
      "description": "Reference image path or URL for i2i/edit modes.",
      "name": "image_ref",
      "required": false,
      "type": "string",
      "artifact_type": "image"
    },
    {
      "description": "Execution backend: 'local' (vibecomfy), 'cloud' (fal), or 'codex' (Codex image_generation).",
      "name": "execution",
      "required": true,
      "type": "string"
    },
    {
      "default": "1",
      "description": "Number of images to generate (sequential N=1 loop).",
      "name": "count",
      "required": false,
      "type": "integer"
    },
    {
      "default": "",
      "description": "Deterministic seed for reproducibility.",
      "name": "seed",
      "required": false,
      "type": "integer"
    },
    {
      "default": "",
      "description": "Negative prompt describing what to avoid.",
      "name": "negative_prompt",
      "required": false,
      "type": "string",
      "artifact_type": "prompt"
    },
    {
      "default": "",
      "description": "Output size (e.g. '1024x1024' or fal size preset).",
      "name": "size",
      "required": false,
      "type": "string"
    },
    {
      "default": "",
      "description": "Codex quality hint folded into the natural-language prompt: low, medium, high, or auto.",
      "name": "quality",
      "required": false,
      "type": "string"
    },
    {
      "default": "",
      "description": "Codex background hint folded into the natural-language prompt: transparent, opaque, or auto.",
      "name": "background",
      "required": false,
      "type": "string"
    },
    {
      "default": "300",
      "description": "Codex per-image timeout in seconds.",
      "name": "timeout",
      "required": false,
      "type": "integer"
    },
    {
      "default": "",
      "description": "Denoising strength for i2i mode (0.0-1.0).",
      "name": "strength",
      "required": false,
      "type": "number"
    },
    {
      "default": "",
      "description": "Classifier-free guidance scale.",
      "name": "guidance_scale",
      "required": false,
      "type": "number"
    },
    {
      "default": "",
      "description": "Number of sampling steps.",
      "name": "steps",
      "required": false,
      "type": "integer"
    },
    {
      "default": "",
      "description": "Upscale mode: 'factor' (multiply dimensions) or 'target' (target resolution).",
      "name": "upscale_mode",
      "required": false,
      "type": "string"
    },
    {
      "default": "",
      "description": "Upscale factor (1-10) when upscale_mode is 'factor'.",
      "name": "upscale_factor",
      "required": false,
      "type": "number"
    },
    {
      "default": "",
      "description": "Target resolution when upscale_mode is 'target': 720p, 1080p, 1440p, 2160p.",
      "name": "target_resolution",
      "required": false,
      "type": "string"
    },
    {
      "default": "",
      "description": "Noise scale (0-1) for the upscaler.",
      "name": "noise_scale",
      "required": false,
      "type": "number"
    },
    {
      "default": "",
      "description": "Comma-separated LoRA registry ids and/or path@scale specs (e.g. 'flux-realism,z-realgen-v2' or 'https://...@0.8').",
      "name": "loras",
      "required": false,
      "type": "string"
    },
    {
      "default": null,
      "description": "Closed shot-generation recipe preserving prompt bindings, ordered references, generator identity, and content hashes.",
      "name": "shot_generation_recipe",
      "required": false,
      "type": "json"
    }
  ],
  "isolation": {
    "mode": "subprocess",
    "network": true
  },
  "keywords": [
    "image",
    "generate",
    "flux",
    "fal",
    "codex",
    "gpt-image",
    "vibecomfy",
    "i2i",
    "t2i",
    "edit",
    "z-image",
    "qwen"
  ],
  "kind": "built_in",
  "metadata": {
    "generation_publication": {
      "modality": "image",
      "variant_of": {"type": "object", "description": "Existing generation_id and variant_id to append this output to."},
      "primary": {"type": "string", "enum": ["preserve", "promote"], "default": "preserve"}
    },
    "output_result_manifest": true,
    "requires_timeline": false,
    "api_provider": "fal",
    "env": [
      "FAL_KEY"
    ],
    "secrets_required": ["FAL_KEY"],
    "runtime_entrypoint": "run_sdk",
    "runtime_entrypoint_note": "run_sdk is the in-process entrypoint returning a JSON-safe payload dict; subprocess / CLI compatibility remains via main() and the __main__ guard at the bottom of run.py.",
    "storage_estimate_required": true,
    "storage_estimate_exact": true,
    "fixed_inputs": {"mode": "t2i", "execution": "cloud"},
    "storage_policy_version": "astrid.cloud-t2i.registry.v1",
    "storage_policy_limits": {"max_count": 4, "max_output_bytes_each": 67108864, "max_manifest_bytes": 1048576, "max_width": 2048, "max_height": 2048},
    "estimated_scratch_bytes": 69206016,
    "estimated_output_bytes": 269484032,
    "hc04_param_ports": ["mode", "prompt", "model", "execution", "count", "seed", "negative_prompt", "guidance_scale", "steps", "size", "loras", "shot_generation_recipe"],
    "hc04_cas_param_ports": [],
    "runtime_file": "run.py",
    "runtime_module": "astrid.packs.generation.executors.generate_image.run",
    "network_policy": {"allowed_protocols":["dns","tcp"],"allowed_destinations":["queue.fal.run:443","fal.run:443","fal.media:443"],"allow_redirects":false,"broker":{"host_managed":true,"kind":"broker","enforced":true,"observable":true,"route":"declared-http-routes","wrapper":"astrid-generic-host"},"descendant_enforcement":{"kind":"broker","validated":true,"observable":true,"route":"declared-http-routes","wrapper":"astrid-generic-host"}}},
  "name": "Generate Image",
  "outputs": [
    {
      "description": "Generated image files identified by receipt entries.",
      "mode": "create_or_replace",
      "name": "generated_images",
      "type": "file",
      "artifact_type": "image"
    },
    {
      "description": "JSON manifest of the generation run.",
      "mode": "create_or_replace",
      "name": "image_manifest",
      "path_template": "{out}/manifest.json",
      "type": "file",
      "artifact_type": null
    }
  ],
  "scoped_configs": ["credentials.fal"],
  "short_description": "Bounded registry-backed cloud text-to-image generation.",
  "version": "2.1"
}
