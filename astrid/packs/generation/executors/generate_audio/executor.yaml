{
  "schema_version": 1,
  "cache": {
    "mode": "none"
  },
  "command": {
    "argv": [
      "{python_exec}",
      "-m",
      "astrid.packs.generation.executors.generate_audio.run",
      "--model",
      "{model}",
      "--mode",
      "{mode}",
      "--execution",
      "{execution}",
      "--out",
      "{out}"
    ]
  },
  "conditions": [
    {
      "input": "model",
      "kind": "requires_input"
    },
    {
      "input": "mode",
      "kind": "requires_input"
    },
    {
      "input": "execution",
      "kind": "requires_input"
    }
  ],
  "description": "Generate audio from text prompts using local (vibecomfy) or cloud (fal) backends. v2: model\u2192mode\u2192backend taxonomy with required --mode. Modes: music (tts/sfx reserved for future sprints).",
  "graph": {
    "consumes": [
      "prompt_or_prompts_file"
    ],
    "provides": [
      "generated_audio",
      "audio_manifest"
    ]
  },
  "id": "generation.generate_audio",
  "inputs": [
    {
      "description": "Generation mode: music (text-to-music). tts and sfx are not wired this sprint.",
      "name": "mode",
      "required": true,
      "type": "string"
    },
    {
      "default": "",
      "description": "Text prompt for audio generation (mutually exclusive with prompts_file).",
      "name": "prompt",
      "required": false,
      "type": "string",
      "artifact_type": "prompt"
    },
    {
      "default": "",
      "description": "JSON/JSONL file of prompts (mutually exclusive with prompt).",
      "name": "prompts_file",
      "required": false,
      "type": "file",
      "artifact_type": "prompt"
    },
    {
      "description": "Model ID from the generation model registry (e.g. 'stable-audio-3-medium', 'minimax-music-3', 'ace-step').",
      "name": "model",
      "required": true,
      "type": "string"
    },
    {
      "description": "Execution backend: 'local' (vibecomfy) or 'cloud' (fal).",
      "name": "execution",
      "required": true,
      "type": "string"
    },
    {
      "default": "1",
      "description": "Number of audio clips to generate (sequential N=1 loop).",
      "name": "count",
      "required": false,
      "type": "integer"
    },
    {
      "default": "",
      "description": "Deterministic seed for reproducibility.",
      "name": "seed",
      "required": false,
      "type": "integer"
    },
    {
      "default": "",
      "description": "Negative prompt describing what to avoid.",
      "name": "negative_prompt",
      "required": false,
      "type": "string",
      "artifact_type": "prompt"
    },
    {
      "default": "",
      "description": "Audio duration in seconds.",
      "name": "duration",
      "required": false,
      "type": "number"
    },
    {
      "default": "",
      "description": "Classifier-free guidance scale.",
      "name": "guidance_scale",
      "required": false,
      "type": "number"
    },
    {
      "default": "",
      "description": "Number of sampling steps.",
      "name": "steps",
      "required": false,
      "type": "integer"
    },
    {
      "default": "",
      "description": "Lyrics prompt for models that support vocals (e.g. MiniMax).",
      "name": "lyrics_prompt",
      "required": false,
      "type": "string",
      "artifact_type": "prompt"
    },
    {
      "default": "",
      "description": "Request instrumental output: 'true' or 'false'.",
      "name": "instrumental",
      "required": false,
      "type": "string"
    },
    {
      "default": "",
      "description": "Output audio format, e.g. 'mp3', 'wav', 'flac' (backend-dependent).",
      "name": "output_format",
      "required": false,
      "type": "string"
    }
  ],
  "isolation": {
    "mode": "subprocess",
    "network": true
  },
  "keywords": [
    "audio",
    "generate",
    "music",
    "fal",
    "vibecomfy",
    "stable-audio",
    "minimax",
    "ace-step"
  ],
  "kind": "built_in",
  "metadata": {
    "generation_publication": {
      "modality": "audio",
      "variant_of": {"type": "object", "description": "Existing generation_id and variant_id to append this output to."},
      "primary": {"type": "string", "enum": ["preserve", "promote"], "default": "preserve"}
    },
    "output_result_manifest": true,
    "requires_timeline": false,
    "api_provider": "multi",
    "env": [
      "FAL_KEY",
      "WAVESPEED_API_KEY"
    ],
    "runtime_entrypoint": "run_sdk",
    "runtime_entrypoint_note": "run_sdk is the in-process entrypoint returning a JSON-safe payload dict; subprocess / CLI compatibility remains via main() and the __main__ guard at the bottom of run.py.",
    "runtime_file": "run.py",
    "runtime_module": "astrid.packs.generation.executors.generate_audio.run",
    "network_policy": {"allowed_protocols":["dns","tcp"],"allowed_destinations":["queue.fal.run:443","fal.run:443","storage.fal.run:443"],"allow_redirects":false,"broker":{"host_managed":true,"kind":"broker","enforced":true,"observable":true,"route":"declared-http-routes","wrapper":"astrid-generic-host"},"descendant_enforcement":{"kind":"broker","validated":true,"observable":true,"route":"declared-http-routes","wrapper":"astrid-generic-host"}}},
  "name": "Generate Audio",
  "outputs": [
    {
      "description": "Generated audio files identified by receipt entries.",
      "mode": "create_or_replace",
      "name": "generated_audio",
      "type": "file",
      "artifact_type": "audio"
    },
    {
      "description": "JSON manifest of the generation run with audio fields.",
      "mode": "create_or_replace",
      "name": "audio_manifest",
      "path_template": "{out}/manifest.json",
      "type": "file",
      "artifact_type": null
    }
  ],
  "scoped_configs": ["credentials.fal", "credentials.wavespeed"],
  "short_description": "Generate audio from text prompts via local or cloud backends. v2: model\u2192mode\u2192backend with music mode.",
  "version": "2.0"
}
