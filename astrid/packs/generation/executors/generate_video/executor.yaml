{
  "schema_version": 1,
  "cache": {
    "mode": "none"
  },
  "command": {
    "argv": [
      "{python_exec}",
      "-m",
      "astrid.packs.generation.executors.generate_video.run",
      "--model",
      "{model}",
      "--mode",
      "{mode}",
      "--execution",
      "{execution}",
      "--out",
      "{out}"
    ]
  },
  "conditions": [
    {
      "input": "model",
      "kind": "requires_input"
    },
    {
      "input": "mode",
      "kind": "requires_input"
    },
    {
      "input": "execution",
      "kind": "requires_input"
    }
  ],
  "description": "Generate videos from text prompts using local (vibecomfy) or cloud (fal) backends. v2: model\u2192mode\u2192backend taxonomy with required --mode. Modes: t2v, i2v, flf, v2v.",
  "graph": {
    "consumes": [
      "prompt_or_prompts_file",
      "image_ref",
      "image_end_ref",
      "video_ref"
    ],
    "provides": [
      "generated_videos",
      "video_manifest"
    ]
  },
  "id": "generation.generate_video",
  "inputs": [
    {
      "description": "Generation mode: t2v (text-to-video), i2v (image-to-video), flf (first-last-frame), v2v (video-to-video). video-edit is not wired this sprint.",
      "name": "mode",
      "required": true,
      "type": "string"
    },
    {
      "default": "",
      "description": "Text prompt for video generation (mutually exclusive with prompts_file).",
      "name": "prompt",
      "required": false,
      "type": "string",
      "artifact_type": "prompt"
    },
    {
      "default": "",
      "description": "JSON/JSONL file of prompts (mutually exclusive with prompt).",
      "name": "prompts_file",
      "required": false,
      "type": "file",
      "artifact_type": "prompt"
    },
    {
      "description": "Model ID from the generation model registry (e.g. 'wan-2.2', 'ltx-2.3').",
      "name": "model",
      "required": true,
      "type": "string"
    },
    {
      "default": "",
      "description": "Reference image path or URL for i2v/flf modes.",
      "name": "image_ref",
      "required": false,
      "type": "string",
      "artifact_type": "image"
    },
    {
      "default": "",
      "description": "End-frame reference image path or URL for flf mode.",
      "name": "image_end_ref",
      "required": false,
      "type": "string",
      "artifact_type": "image"
    },
    {
      "default": "",
      "description": "Driving motion video path or URL for v2v mode.",
      "name": "video_ref",
      "required": false,
      "type": "string",
      "artifact_type": "video"
    },
    {
      "description": "Execution backend: 'local' (vibecomfy) or 'cloud' (fal).",
      "name": "execution",
      "required": true,
      "type": "string"
    },
    {
      "default": "1",
      "description": "Number of videos to generate (sequential N=1 loop).",
      "name": "count",
      "required": false,
      "type": "integer"
    },
    {
      "default": "",
      "description": "Deterministic seed for reproducibility.",
      "name": "seed",
      "required": false,
      "type": "integer"
    },
    {
      "default": "",
      "description": "Negative prompt describing what to avoid.",
      "name": "negative_prompt",
      "required": false,
      "type": "string",
      "artifact_type": "prompt"
    },
    {
      "default": "",
      "description": "Output resolution (e.g. '1280x720').",
      "name": "resolution",
      "required": false,
      "type": "string"
    },
    {
      "default": "",
      "description": "Number of frames to generate.",
      "name": "frames",
      "required": false,
      "type": "integer"
    },
    {
      "default": "",
      "description": "Frames per second.",
      "name": "fps",
      "required": false,
      "type": "integer"
    },
    {
      "default": "",
      "description": "Duration in seconds (alternative to --frames; requires --fps).",
      "name": "duration",
      "required": false,
      "type": "number"
    },
    {
      "default": "",
      "description": "Classifier-free guidance scale.",
      "name": "guidance_scale",
      "required": false,
      "type": "number"
    },
    {
      "default": "",
      "description": "Number of sampling steps.",
      "name": "steps",
      "required": false,
      "type": "integer"
    },
    {
      "default": "",
      "description": "SCAIL-2 driving signal: end_to_end (default) or pose.",
      "name": "driving_type",
      "required": false,
      "type": "string"
    },
    {
      "default": "",
      "description": "SCAIL-2 subject type: human (default) or animal.",
      "name": "subject_type",
      "required": false,
      "type": "string"
    },
    {
      "default": "",
      "description": "LoRAs to apply (cloud/fal backends with a lora_endpoint). JSON array of {\"path\": <url>, \"scale\": <float>, \"transformer\": \"both\"|\"high\"|\"low\"} items, or comma-separated url:scale entries. Routes the request to the model's lora_endpoint.",
      "name": "loras",
      "required": false,
      "type": "string"
    }
  ],
  "isolation": {
    "mode": "subprocess",
    "network": true
  },
  "keywords": [
    "video",
    "generate",
    "wan",
    "ltx",
    "fal",
    "vibecomfy",
    "i2v",
    "t2v",
    "first-last-frame",
    "video-to-video",
    "v2v",
    "scail-2"
  ],
  "kind": "built_in",
  "metadata": {
    "generation_publication": {
      "modality": "video",
      "variant_of": {"type": "object", "description": "Existing generation_id and variant_id to append this output to."},
      "primary": {"type": "string", "enum": ["preserve", "promote"], "default": "preserve"}
    },
    "output_result_manifest": true,
    "requires_timeline": false,
    "api_provider": "multi",
    "env": [
      "FAL_KEY"
    ],
    "runtime_entrypoint": "run_sdk",
    "runtime_entrypoint_note": "run_sdk is the in-process entrypoint returning a JSON-safe payload dict; subprocess / CLI compatibility remains via main() and the __main__ guard at the bottom of run.py.",
    "storage_estimate_required": true,
    "storage_estimate_exact": true,
    "storage_input_max_bytes": {"image_ref": 8388608, "image_end_ref": 8388608},
    "estimated_scratch_bytes": 805306368,
    "estimated_output_bytes": 536870912,
    "hc04_param_ports": ["mode", "prompt", "model", "image_ref", "image_end_ref", "execution", "count", "seed", "negative_prompt", "resolution", "frames", "fps", "duration", "guidance_scale", "steps", "driving_type", "subject_type", "loras"],
    "hc04_cas_param_ports": ["image_ref", "image_end_ref"],
    "hc04_optional_cas_param_ports": ["image_end_ref"],
    "storage_policy_version": "astrid.video.flf.v1",
    "runtime_file": "run.py",
    "runtime_module": "astrid.packs.generation.executors.generate_video.run",
    "network_policy": {"allowed_protocols":["dns","tcp"],"allowed_destinations":["queue.fal.run:443","fal.run:443","storage.fal.run:443"],"allow_redirects":false,"broker":{"host_managed":true,"kind":"broker","enforced":true,"observable":true,"route":"declared-http-routes","wrapper":"astrid-generic-host"},"descendant_enforcement":{"kind":"broker","validated":true,"observable":true,"route":"declared-http-routes","wrapper":"astrid-generic-host"}}},
  "name": "Generate Video",
  "outputs": [
    {
      "description": "Generated video files identified by receipt entries.",
      "mode": "create_or_replace",
      "name": "generated_videos",
      "type": "file",
      "artifact_type": "video/clip"
    },
    {
      "description": "JSON manifest of the generation run with video fields.",
      "mode": "create_or_replace",
      "name": "video_manifest",
      "path_template": "{out}/manifest.json",
      "type": "file",
      "artifact_type": null
    }
  ],
  "scoped_configs": ["credentials.fal"],
  "short_description": "Generate videos from text prompts via local or cloud backends. v2: model→mode→backend with t2v/i2v/flf/v2v modes.",
  "version": "2.0"
}
