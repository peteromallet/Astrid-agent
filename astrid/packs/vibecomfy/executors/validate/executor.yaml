{
  "schema_version": 1,
  "cache": {
    "mode": "none"
  },
  "command": {
    "argv": [
      "{python_exec}",
      "-m",
      "astrid.packs.vibecomfy.executors.validate.run",
      "validate",
      "{workflow}",
      "--python",
      "{python}",
      "--companion",
      "{companion}",
      "--source",
      "{source}",
      "--out",
      "{out}"
    ],
    "input_args": [
      {
        "input": "python_execution_consent",
        "flag": "--python-execution-consent",
        "optional": true
      },
      {
        "input": "workflow_inputs",
        "flag": "--workflow-inputs",
        "optional": true
      }
    ]
  },
  "description": "Validate UI JSON or canonical bundle structure offline. Canonical Python requires python_execution_consent=confirmed through VibeComfy's audited CLI gate with --no-schema. Runtime/session and target-schema validation are deferred to vibecomfy.run.",
  "graph": {
    "consumes": [
      "workflow",
      "python",
      "companion",
      "source",
      "python_execution_consent",
      "workflow_inputs"
    ],
    "provides": [
      "vibecomfy_validation"
    ]
  },
  "id": "vibecomfy.validate",
  "inputs": [
    {
      "default": "",
      "description": "Optional VibeComfy UI workflow JSON. Use this or all three canonical members.",
      "name": "workflow",
      "required": false,
      "type": "file"
    },
    {
      "default": "",
      "description": "Optional canonical workflow.py member.",
      "name": "python",
      "required": false,
      "type": "file"
    },
    {
      "default": "",
      "description": "Optional canonical workflow.vibe.json companion member.",
      "name": "companion",
      "required": false,
      "type": "file"
    },
    {
      "default": "",
      "description": "Optional byte-identical source.json member.",
      "name": "source",
      "required": false,
      "type": "file"
    },
    {
      "description": "Required only for canonical Python bundles; exact accepted value is confirmed. Omit for static UI JSON validation.",
      "name": "python_execution_consent",
      "required": false,
      "type": "string"
    },
    {
      "description": "Optional concrete JSON bindings. When supplied, validation resolves the declared model root through the same public bundle compiler used by execution.",
      "name": "workflow_inputs",
      "required": false,
      "type": "string"
    }
  ],
  "outputs": [
    {
      "name": "validation",
      "type": "file",
      "path_template": "{out}/validation-report.json",
      "artifact_type": "vibecomfy/workflow-validation-report",
      "description": "Structural validation status (canonical_bundle_structural for Python bundles), issues, consent and gate audit; runtime_validation is explicitly deferred to vibecomfy.run. Success does not establish runtime readiness."
    }
  ],
  "isolation": {
    "mode": "subprocess",
    "network": false,
    "requirements": [
      "vibecomfy"
    ]
  },
  "keywords": [
    "comfyui",
    "vibecomfy",
    "workflow",
    "validate",
    "check",
    "json"
  ],
  "kind": "external",
  "metadata": {
    "catalog_source": "none_declared",
    "cli_module": "vibecomfy.cli",
    "command_names": [
      "run",
      "validate"
    ],
    "homepage": "https://github.com/peteromallet/VibeComfy",
    "network_behavior": {
      "run": true,
      "validate": false
    },
    "nodes": [],
    "pack_id": "vibecomfy",
    "prompts": [],
    "requirements": [
      "vibecomfy"
    ],
    "requirements_source": "requirements.txt",
    "runtime_file": "run.py",
    "runtime_module": "astrid.packs.vibecomfy.executors.validate.run",
    "vibecomfy_command": "validate",
    "workflow_input_contract": {
      "description": "UI JSON or complete canonical Python/companion/source sibling bundle.",
      "format": "ComfyUI/VibeComfy workflow JSON",
      "name": "workflow",
      "required": false,
      "type": "file"
    },
    "workflows": []
  },
  "name": "VibeComfy Validate",
  "short_description": "Validate workflow structure offline; runtime checks belong to vibecomfy.run.",
  "version": "0.1.0"
}
