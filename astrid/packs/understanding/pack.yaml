schema_version: 1
id: understanding
name: Astrid Understanding
version: 1.0.0
origin: builtin
install_tier: core
pack_type: capability
domain: media
stability: stable
support: core
visibility: visible
permissions:
  - id: subprocess
    reason: Runs audio, visual, and video understanding executors.
  - id: project_files
    reason: Reads audio, video, and image files for analysis.
  - id: network
    reason: Sends media to OpenAI understanding APIs for audio, image, and video analysis.
  - id: environment
    reason: Reads the OpenAI API credential used by understanding executors.
description: LLM-based audio, image, and video understanding — caption, query, and structured extraction over media.
keywords:
- understanding
- caption
- vision
- audio
- video
- transcribe-scene
- llm
- structured-output
capabilities:
- understand_media
- understand_audio
- understand_image
- understand_video
- describe_scene
agent:
  purpose: Choose this pack to inspect or describe media content — caption images/scenes, query audio or synchronized audio+video windows, or extract schema-constrained structured fields from a clip via an LLM.
  do_not_use_for: Do not use to edit, cut, or render video (use video_editing) or to generate new media (use generation; use vibecomfy only for raw ComfyUI workflow graphs).
  normal_entrypoints:
  - understanding.understand
  - understanding.scene_describe
content:
  executors: executors
