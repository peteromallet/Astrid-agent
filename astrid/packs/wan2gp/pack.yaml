schema_version: 2
id: wan2gp
name: Astrid Wan2GP
version: 1.0.0
status: active
domain: generation
stability: experimental
support: core
visibility: visible
permissions:
  - id: subprocess
    reason: Runs Wan2GP native Python engine (shared.api / WanGPSession) for video generation.
  - id: project_files
    reason: Reads input images/videos and writes generated outputs to private spool.
  - id: accelerator
    reason: May use GPU for Wan2GP model inference when available.
description: Native Wan2GP video generation through the GenericPackHost-owned shared.api session (official upstream API candidate f3f204e5). The host retains the native interpreter; Runtime owns task authority and attempt publication.
keywords:
- wan2gp
- wan
- video
- generation
- gpu
- reigh
capabilities:
- generate_video
- validate_settings
agent:
  purpose: Choose this pack to generate video via the native Wan2GP engine (Wan2GP, not fal/cloud). GenericPackHost initializes the explicitly admitted upstream session once and maps native jobs through ManagedToolSession.
  do_not_use_for: Do not use for VibeComfy/ComfyUI workflows (use vibecomfy) or fal/cloud video (use generation); this is the native Wan2GP engine seam only.
  normal_entrypoints:
  - wan2gp.generate_video
  - wan2gp.validate_settings
content:
  executors: executors
documentation:
  kind: skill
  path: skill/SKILL.md
