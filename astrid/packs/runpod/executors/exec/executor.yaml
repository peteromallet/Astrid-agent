    "network_policy": {"allowed_protocols":["dns","tcp"],"allowed_destinations":["api.runpod.io:443","rest.runpod.io:443","graphql.runpod.io:443","runpod.io:443"],"dynamic_route_resolver":"runpod_pod_handle_ssh","dynamic_tcp_inputs":["pod_handle"],"allow_redirects":false,"broker":{"host_managed":true,"kind":"broker","enforced":true,"observable":true,"route":"declared-http-and-tcp-routes","wrapper":"astrid-generic-host"},"descendant_enforcement":{"kind":"broker","validated":true,"observable":true,"route":"declared-http-and-tcp-routes","wrapper":"astrid-generic-host"}}},
