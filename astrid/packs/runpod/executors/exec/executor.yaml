{
  "schema_version": 1,
  "cache": {
    "mode": "none"
  },
  "command": {
    "argv": [
      "{python_exec}",
      "-m",
      "astrid.packs.runpod.executors.exec.run",
      "exec",
      "--produces-dir",
      "{out}/produces"
