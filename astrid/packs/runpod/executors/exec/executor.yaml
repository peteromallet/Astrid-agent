      },
      {
        "input": "remote_root",
        "flag": "--remote-root",
        "optional": true
      },
      {
        "input": "remote_script",
        "flag": "--remote-script",
        "optional": true
      },
      {
        "input": "timeout",
        "flag": "--timeout",
        "optional": true
      },
      {
        "input": "upload_mode",
        "flag": "--upload-mode",
        "optional": true
      },
      {
        "input": "excludes",
        "flag": "--excludes",
        "optional": true
      }
    ]
