{
  "schema_version": 1,
  "cache": {
    "mode": "none"
  },
  "command": {
    "argv": [
      "{python_exec}",
      "-m",
      "astrid.packs.runpod.executors.pull.run",
      "pull",
      "--produces-dir",
      "{out}/produces"
    ],
    "input_args": [
      {
        "input": "pod_handle",
        "flag": "--pod-handle"
      },
      {
        "input": "remote_path",
        "flag": "--remote-path",
        "repeatable": true
      },
      {
        "input": "local_dir",
        "flag": "--local-dir"
      },
      {
        "input": "ssh_key",
        "flag": "--ssh-key",
        "optional": true
      }
    ]
  },
  "conditions": [
    {
      "input": "pod_handle",
      "kind": "requires_input"
    }
  ],
  "description": "Pull one or more remote artifacts from an existing RunPod pod using pod_handle.json SSH details.",
  "graph": {
    "consumes": [
      "pod_handle"
    ],
    "provides": [
      "artifact_pull",
      "artifact_dir"
    ]
  },
  "id": "runpod.pull",
  "inputs": [
    {
      "description": "Path to the pod_handle.json from a prior provision step.",
      "name": "pod_handle",
      "required": true,
      "type": "file"
    },
    {
      "description": "Remote file or directory to pull. Repeatable on the raw CLI.",
      "name": "remote_path",
      "required": true,
      "type": "string"
    },
    {
      "description": "Local destination directory.",
      "name": "local_dir",
      "required": true,
      "type": "path"
    },
    {
      "description": "Optional private SSH key path.",
      "name": "ssh_key",
      "required": false,
      "type": "file"
    }
  ],
  "isolation": {
    "mode": "subprocess",
    "network": true,
    "env_passthrough": ["RUNPOD_SSH_IDENTITY_PATH"],
    "requirements": [
      "runpod-lifecycle>=0.3.1.dev0,<0.4"
    ]
  },
  "keywords": [
    "runpod",
    "gpu",
    "pull",
    "scp",
    "artifact",
    "checkpoint"
  ],
  "kind": "external",
  "metadata": {
    "catalog_source": "none_declared",
    "cli_module": "astrid.packs.runpod.executors.pull.run",
    "command_names": [
      "provision",
      "exec",
      "pull",
      "teardown",
      "session"
    ],
    "homepage": "https://github.com/peteromallet/runpod-lifecycle",
    "network_behavior": {
      "provision": true,
      "exec": true,
      "pull": true,
      "teardown": true,
      "session": true
    },
    "nodes": [],
    "pack_id": "runpod",
    "prompts": [],
    "requirements": [
      "runpod-lifecycle>=0.3.1.dev0,<0.4"
    ],
    "requirements_source": "requirements.txt",
    "runtime_file": "run.py",
    "runtime_module": "astrid.packs.runpod.executors.pull.run",
    "network_policy": {"allowed_protocols":["dns","tcp"],"allowed_destinations":["api.runpod.io:443","rest.runpod.io:443","graphql.runpod.io:443","runpod.io:443"],"allow_redirects":false,"broker":{"host_managed":true,"kind":"broker","enforced":true,"observable":true,"route":"declared-http-routes","wrapper":"astrid-generic-host"},"descendant_enforcement":{"kind":"broker","validated":true,"observable":true,"route":"declared-http-routes","wrapper":"astrid-generic-host"}}},
  "name": "RunPod Pull",
  "short_description": "Pull artifacts from an existing RunPod pod into local storage.",
  "version": "0.1.0"
}
