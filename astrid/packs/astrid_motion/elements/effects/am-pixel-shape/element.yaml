schema_version: 1
id: am-pixel-shape
kind: effect
pack_id: astrid_motion
short_description: Procedural pixel shape (ring, dot, underline or arrow) on the sticker pixel grid.
description: Draws a small hard-edged pixel shape with no asset. Each cell is px_scale screen px (6 matches am-sprite at scale 6, so a ring or full stop sits on the same grid as the stickers). Shapes are ring (ellipse outline), dot (filled ellipse, a pixel full stop at 3x3), underline (bottom rows of the box) and arrow (a shaft with a right-pointing head). Position x and y are logical px on the 320x180 grid, like am-sprite. Static; it does not animate.
keywords:
  - pixel
  - shape
  - ring
  - dot
  - underline
  - arrow
  - sticker
  - procedural
outputs:
  - name: clip
    type: clip
    artifact_type: clip/visual
    description: Pixel shape overlay.
metadata:
  label: AM Pixel Shape
  description: Procedural pixel ring, dot, underline or arrow on the sticker grid.
  whenToUse: Use for a pixel mark drawn over a plate, such as a ring around a word, a full stop, an underline or an arrow. Do not draw these as PNGs. Set w and h in cells (a 3x3 dot is a full stop), px_scale to 6 to match am-sprite at scale 6, and x and y in logical px.
defaults:
  shape: ring
  color: '#1F1F1F'
  px_scale: 6
  x: 0
  y: 0
  w: 24
  h: 24
  stroke: 2
dependencies:
  js_packages: []
  python_requirements: []
schema:
  type: object
  additionalProperties: true
  properties:
    shape:
      type: string
      enum:
      - ring
      - dot
      - underline
      - arrow
    color:
      type: string
    px_scale:
      type: integer
      minimum: 1
      maximum: 24
      description: Screen px per cell. 6 matches the sticker grid.
    x:
      type: number
      description: Logical px from the left of the 320x180 grid.
    y:
      type: number
      description: Logical px from the top of the 320x180 grid.
    w:
      type: integer
      minimum: 1
      maximum: 200
      description: Width in cells.
    h:
      type: integer
      minimum: 1
      maximum: 200
      description: Height in cells.
    stroke:
      type: integer
      minimum: 1
      maximum: 20
      description: Stroke thickness in cells (ring, underline, arrow shaft).
