schema_version: 3
id: iteration
name: Astrid Iteration
version: 1.0.0
status: active
domain: development
stability: stable
support: core
permissions:
- id: subprocess
  reason: Runs iteration assembly and experiment actions as subprocesses.
- id: project_files
  reason: Reads iteration manifests and writes timeline and asset files.
description: Builds an iteration video from runtime-owned run provenance — discovers
  candidate runs through the generated client, scores quality, and assembles a canonical
  iteration timeline plus render-ready hype inputs. Also provides provider-independent
  experiment preparation and review.
keywords:
- iteration
- provenance
- runtime
- quality
- timeline
- hype
- video
- assemble
- experiment
- review
- provider-independent
capabilities:
- collect_runtime_provenance
- score_iteration_quality
- assemble_iteration_timeline
- emit_render_adapter
- experiment_prepare
- experiment_review
- experiment_import
- experiment_review_session
documentation:
  kind: skill
  path: docs/SKILL.md
agent:
  purpose: 'Use to turn runtime-owned run history into an iteration video artifact:
    discover provenance/quality from the selected project runtime, then assemble the
    canonical iteration timeline and render-compatible hype inputs.'
  do_not_use_for: Not for raw video editing or clip trimming (use the media pack)
    or final video rendering (use the rendering pack on the emitted hype adapter).
  normal_entrypoints:
  - iteration.assemble
actions:
  assemble:
    name: Iteration Assemble
    version: '1.0'
    short_description: Adapt runtime-materialized iteration data into result-only
      timeline and render artifacts.
    description: Adapt runtime-materialized iteration inputs into result-only iteration
      artifacts and render-compatible hype inputs.
    keywords:
    - iteration
    - video
    - assemble
    - render
    - hype
    - adapt
    conditions:
    - input: prepare_dir
      kind: requires_input
    inputs:
    - description: Attempt directory containing runtime-materialized iteration manifest
        and quality inputs.
      name: prepare_dir
      required: true
      type: directory
    outputs:
    - description: Canonical iteration timeline.
      mode: create_or_replace
      name: timeline
      path_template: '{out}/iteration.timeline.json'
      type: file
      artifact_type: timeline
    - description: Final iteration manifest.
      mode: create_or_replace
      name: manifest
      path_template: '{out}/iteration.manifest.json'
      type: file
    - description: Iteration HTML report.
      mode: create_or_replace
      name: report
      path_template: '{out}/iteration.report.html'
      type: file
    - description: Copied quality report with assembly status.
      mode: create_or_replace
      name: quality
      path_template: '{out}/iteration.quality.json'
      type: file
    - description: Render-compatible hype timeline adapter.
      mode: create_or_replace
      name: hype_timeline
      path_template: '{out}/hype.timeline.json'
      type: file
      artifact_type: timeline
    - description: Render-compatible hype assets adapter.
      mode: create_or_replace
      name: hype_assets
      path_template: '{out}/hype.assets.json'
      type: file
      artifact_type: timeline/assets
    cache:
      mode: none
    isolation:
      mode: subprocess
      network: false
    metadata:
      output_result_manifest: true
      runtime_entrypoint: main
      runtime_file: actions/assemble/run.py
      runtime_module: astrid.packs.iteration.actions.assemble.run
    invocation:
      kind: command
      command:
        argv:
        - '{python_exec}'
        - -m
        - astrid.packs.iteration.actions.assemble.run
        - --prepare-dir
        - '{prepare_dir}'
        - --out
        - '{out}'
    graph:
      consumes:
      - iteration_manifest
      - iteration_quality
      provides:
      - iteration_timeline
      - iteration_report
      - render_adapter
    resources:
    - kind: implementation
      path: actions/assemble/__init__.py
    - kind: implementation
      path: actions/assemble/run.py
    - kind: documentation
      path: actions/assemble/STAGE.md
  experiment_import:
    name: Experiment Import
    version: '1.0'
    short_description: Import an unmanaged run root into an experiment without rewriting
      history or guessing ambiguous associations.
    description: Import an unmanaged/legacy run root (e.g. Discord-command POC) into
      a provider-independent experiment with an honest import report. Read-only over
      source evidence; idempotent and byte-stable.
    keywords:
    - experiment
    - import
    - legacy
    - discord
    - provider-independent
    - idempotent
    - capture
    conditions:
    - input: root
      kind: requires_input
    inputs:
    - description: Unmanaged run root directory (timestamped submission subdirectories).
      name: root
      required: true
      type: directory
    - description: Optional JSON file of manual subdir -> {prompt, seed, label} mappings.
      name: mapping
      required: false
      type: file
    - description: Optional JSON file with a rubric array (defaults to a generic 0/1
        usable-output rubric).
      name: rubric_file
      required: false
      type: file
    - description: Project slug for the imported experiment (defaults to the root
        dir name).
      name: project_slug
      required: false
      type: string
    - description: Experiment id (defaults to <project-slug>-import). Must match ^[a-z0-9][a-z0-9._-]*$.
      name: experiment_id
      required: false
      type: string
    - description: Experiment title (defaults to 'Imported runs from <root name>').
      name: title
      required: false
      type: string
    - description: Experiment question (defaults to 'What do these legacy runs show?').
      name: question
      required: false
      type: string
    outputs:
    - description: Imported experiment definition referencing synthesized run ids.
      mode: create_or_replace
      name: experiment
      path_template: '{out}/experiment.json'
      type: file
    - description: 'Honest import report: counts, ambiguous/screenshot-only cases,
        dedup, capture gaps.'
      mode: create_or_replace
      name: import_report
      path_template: '{out}/import.report.json'
      type: file
    - description: 'Synthesized imported run tree: one subdir per case with manifest.json
        and hardlinked source media.'
      mode: create_or_replace
      name: runs
      path_template: '{out}/runs'
      type: directory
    cache:
      mode: none
    isolation:
      mode: subprocess
      network: false
      env_passthrough:
      - ASTRID_REPO_ROOT
    metadata:
      output_result_manifest: true
      requires_timeline: false
      runtime_entrypoint: main
      runtime_file: actions/experiment_import/run.py
      runtime_module: astrid.packs.iteration.actions.experiment_import.run
    invocation:
      kind: command
      command:
        argv:
        - '{python_exec}'
        - -m
        - astrid.packs.iteration.actions.experiment_import.run
        - --root
        - '{root}'
        - --out
        - '{out}'
        input_args:
        - input: mapping
          flag: --mapping
          optional: true
        - input: rubric_file
          flag: --rubric-file
          optional: true
        - input: project_slug
          flag: --project-slug
          optional: true
        - input: experiment_id
          flag: --experiment-id
          optional: true
        - input: title
          flag: --title
          optional: true
        - input: question
          flag: --question
          optional: true
    graph:
      consumes:
      - unmanaged_run_root
      - optional_manual_mappings
      provides:
      - imported_experiment_definition
      - import_report
    resources:
    - kind: implementation
      path: actions/experiment_import/__init__.py
    - kind: implementation
      path: actions/experiment_import/run.py
    - kind: documentation
      path: actions/experiment_import/STAGE.md
  experiment_prepare:
    name: Experiment Prepare
    version: '1.0'
    short_description: Normalize an experiment's provider manifests into a provider-independent
      review model with diagnostics.
    description: Resolve experiment cases, validate source manifests, normalize provider
      data, and emit review.json + diagnostics.json + manifest.json.
    keywords:
    - experiment
    - review
    - prepare
    - normalize
    - provider-independent
    - manifest
    - diagnostics
    conditions:
    - input: experiment
      kind: requires_input
    inputs:
    - description: Path to experiment.json definition file.
      name: experiment
      required: true
      type: file
      artifact_type: experiment
    - description: Directory containing project runs (for resolving run/manifest paths).
      name: runs_dir
      required: true
      type: directory
      artifact_type: experiment_runs
    outputs:
    - description: Provider-independent normalized review with case cards.
      mode: create_or_replace
      name: review
      path_template: '{out}/review.json'
      type: file
    - description: 'Experiment diagnostics: status counts, duplicates, input-echo,
        capture gaps.'
      mode: create_or_replace
      name: diagnostics
      path_template: '{out}/diagnostics.json'
      type: file
    cache:
      mode: none
    isolation:
      mode: subprocess
      network: false
      env_passthrough:
      - ASTRID_REPO_ROOT
    metadata:
      output_result_manifest: true
      requires_timeline: false
      runtime_entrypoint: main
      runtime_file: actions/experiment_prepare/run.py
      runtime_module: astrid.packs.iteration.actions.experiment_prepare.run
    invocation:
      kind: command
      command:
        argv:
        - '{python_exec}'
        - -m
        - astrid.packs.iteration.actions.experiment_prepare.run
        - --experiment
        - '{experiment}'
        - --runs-dir
        - '{runs_dir}'
        - --out
        - '{out}'
    graph:
      consumes:
      - experiment_definition
      - run_manifests
      provides:
      - normalized_review
      - experiment_diagnostics
    resources:
    - kind: implementation
      path: actions/experiment_prepare/__init__.py
    - kind: implementation
      path: actions/experiment_prepare/run.py
    - kind: documentation
      path: actions/experiment_prepare/STAGE.md
  experiment_review:
    name: Experiment Review
    version: '1.0'
    short_description: Render a deterministic HTML gallery comparing provider outputs
      with prompt, parameters, warnings, and diagnostics.
    description: Render a provider-independent deterministic HTML review page from
      a normalized review.json.
    keywords:
    - experiment
    - review
    - html
    - render
    - provider-independent
    - comparison
    - gallery
    conditions:
    - input: review
      kind: requires_input
    inputs:
    - description: Path to normalized review.json from experiment_prepare.
      name: review
      required: true
      type: file
    - description: Optional conclusions.json (observations/inferences/decisions) bound
        to the same experiment.
      name: conclusions
      required: false
      type: file
    - description: Optional review.final.json with recorded rubric decisions for the
        same experiment.
      name: review_final
      required: false
      type: file
    - description: Optional owning runs directory for verified offline media playback.
      name: runs_dir
      required: false
      type: directory
    outputs:
    - description: Deterministic provider-independent HTML review page.
      mode: create_or_replace
      name: review_html
      path_template: '{out}/review.html'
      type: file
    - description: Portable deterministic case summary for external analysis.
      mode: create_or_replace
      name: review_summary
      path_template: '{out}/review.summary.csv'
      type: file
    cache:
      mode: none
    isolation:
      mode: subprocess
      network: false
      env_passthrough:
      - ASTRID_REPO_ROOT
    metadata:
      output_result_manifest: true
      requires_timeline: false
      runtime_entrypoint: main
      runtime_file: actions/experiment_review/run.py
      runtime_module: astrid.packs.iteration.actions.experiment_review.run
    invocation:
      kind: command
      command:
        argv:
        - '{python_exec}'
        - -m
        - astrid.packs.iteration.actions.experiment_review.run
        - --review
        - '{review}'
        - --out
        - '{out}'
        input_args:
        - input: conclusions
          flag: --conclusions
          optional: true
        - input: review_final
          flag: --review-final
          optional: true
        - input: runs_dir
          flag: --runs-dir
          optional: true
    graph:
      consumes:
      - normalized_review
      provides:
      - review_html_page
    resources:
    - kind: implementation
      path: actions/experiment_review/__init__.py
    - kind: implementation
      path: actions/experiment_review/run.py
    - kind: documentation
      path: actions/experiment_review/STAGE.md
  experiment_review_session:
    name: Experiment Review Session
    inputs:
    - name: experiment
      type: file
      required: true
      description: Path to the provider-independent experiment.json document.
    - name: runs_dir
      type: directory
      required: true
      description: Directory containing the experiment's project runs.
    - name: reviewer_id
      type: string
      required: false
      default: reviewer
      description: Reviewer identity recorded in the final payload.
    - name: reviewer_type
      type: string
      required: false
      default: human
      description: Reviewer type recorded in the final payload.
    - name: conclusions
      type: file
      required: false
      description: Optional conclusions.json displayed alongside review cases.
    - name: port
      type: integer
      required: false
      default: 0
      description: Loopback review server port; zero selects an available port.
    - name: timeout
      type: integer
      required: false
      default: 0
      description: Idle timeout in seconds; zero waits without a timeout.
    - name: no_open
      type: boolean
      required: false
      default: false
      description: Do not open the review page in a browser automatically.
    - name: skip_server
      type: boolean
      required: false
      default: false
      description: Build session artifacts without launching the review server.
    version: '1.0'
    short_description: Interactive rubric review session over a prepared experiment,
      reusing editorial.human_review with safe mounted media.
    description: Interactive, schema-validated rubric review session over a prepared
      experiment review. Reuses editorial.human_review as the server and mounts each
      run's media under a safe per-run route.
    keywords:
    - experiment
    - review
    - rubric
    - human-review
    - session
    - media-mount
    - provider-independent
    cache:
      mode: none
    isolation:
      mode: subprocess
      network: false
    metadata:
      requires_timeline: false
      runtime_entrypoint: main
      runtime_file: actions/experiment_review_session/run.py
      runtime_module: astrid.packs.iteration.actions.experiment_review_session.run
      output_result_manifest: true
    invocation:
      kind: command
      command:
        argv:
        - '{python_exec}'
        - -m
        - astrid.packs.iteration.actions.experiment_review_session.run
        - --experiment
        - '{experiment}'
        - --runs-dir
        - '{runs_dir}'
        - --out
        - '{out}'
        input_args:
        - input: reviewer_id
          flag: --reviewer-id
          optional: true
        - input: reviewer_type
          flag: --reviewer-type
          optional: true
        - input: conclusions
          flag: --conclusions
          optional: true
        - input: port
          flag: --port
          optional: true
        - input: timeout
          flag: --timeout
          optional: true
        - input: no_open
          flag: --no-open
          optional: true
        - input: skip_server
          flag: --skip-server
          optional: true
    outputs:
    - name: review
      type: file
      mode: create_or_replace
      path_template: '{out}/review.json'
      description: Normalized experiment review, copied from the local preparation.
    - name: data
      type: file
      mode: create_or_replace
      path_template: '{out}/data.json'
      description: Immutable interactive review data.
    - name: session_html
      type: file
      mode: create_or_replace
      path_template: '{out}/review_session.html'
      description: Self-contained interactive review page.
    - name: response_schema
      type: file
      mode: create_or_replace
      path_template: '{out}/response_schema.json'
      description: Final rubric response schema.
    - name: media_map
      type: file
      mode: create_or_replace
      path_template: '{out}/media_map.json'
      description: Relative run-to-mount prefix mapping.
    - name: state
      type: file
      mode: create_or_replace
      path_template: '{out}/review.state.json'
      description: Versioned review draft, or settled final child state.
    - name: validated_final
      type: file
      mode: create_or_replace
      path_template: '{out}/review.final.validated.json'
      description: Validated final review; published only after final submission.
    graph:
      child_actions:
      - iteration.experiment_prepare
      - editorial.human_review
      child_orchestrators: []
    resources:
    - kind: implementation
      path: actions/experiment_review_session/__init__.py
    - kind: implementation
      path: actions/experiment_review_session/run.py
    - kind: documentation
      path: actions/experiment_review_session/STAGE.md
resources:
- kind: documentation
  path: docs/SKILL.md
