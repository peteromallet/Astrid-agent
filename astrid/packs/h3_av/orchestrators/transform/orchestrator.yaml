schema_version: 1
id: h3_av.transform
name: Transform with H3 audiovisual continuation
kind: built_in
version: 0.1.1
short_description: Prepare, compile, validate, run, compose, verify, and finalize one bounded H3 continuation.
description: Coordinates pack executors and VibeComfy through SDK capability invocation; it creates no second task authority.
keywords: [h3, minimax, continuation, vibecomfy, runpod]
inputs:
  - name: request
    type: file
    required: true
    description: H3 audiovisual request v1 JSON/YAML document.
  - name: input_bundle
    type: file
    required: true
    description: Hash-verified managed ZIP containing exactly the request-declared assets.
  - name: execution_request
    type: file
    required: false
    default: ""
    description: Optional normalized target/lifecycle request for the VibeComfy child.
child_executors:
  - h3_av.prepare
  - h3_av.compile
  - vibecomfy.validate
  - vibecomfy.run
  - h3_av.compose
  - h3_av.verify
  - h3_av.publication_finalizer
child_orchestrators: []
runtime:
  kind: command
  command:
    argv:
      - "{python_exec}"
      - -m
      - astrid.packs.h3_av.orchestrators.transform.run
      - --request
      - "{request}"
      - --input-bundle
      - "{input_bundle}"
      - --execution-request
      - "{execution_request}"
      - --out
      - "{out}"
      - --project
      - "{project}"
      - "{orchestrator_args}"
cache:
  mode: none
isolation:
  mode: subprocess
  network: true
  env_passthrough: [VIBECOMFY_CHECKOUT, PYTHONPATH, VIBECOMFY_HEADLESS]
  requirements: [vibecomfy]
docs:
  stage: STAGE.md
metadata:
  runtime_entrypoint: main
  runtime_file: run.py
  runtime_module: astrid.packs.h3_av.orchestrators.transform.run
  child_execution_plan:
    root_inputs: [request, input_bundle]
    stages:
      - name: prepare
        capability_id: h3_av.prepare
        target: {kind: default}
        inputs:
          - {name: request, root_input: request}
          - {name: input_bundle, root_input: input_bundle}
      - name: compile
        capability_id: h3_av.compile
        target: {kind: default}
        inputs:
          - {name: preparation, producer_stage: prepare, output_port: preparation}
          - {name: input_bundle, root_input: input_bundle}
      - name: validate
        capability_id: vibecomfy.validate
        target: {kind: default}
        inputs:
          - {name: python, producer_stage: compile, output_port: python}
          - {name: companion, producer_stage: compile, output_port: companion}
          - {name: source, producer_stage: compile, output_port: source}
          - {name: managed_assets, producer_stage: compile, output_port: managed_assets}
      - name: run
        capability_id: vibecomfy.run
        target: {kind: default}
        inputs:
          - {name: python, producer_stage: compile, output_port: python}
          - {name: companion, producer_stage: compile, output_port: companion}
          - {name: source, producer_stage: compile, output_port: source}
          - {name: managed_assets, producer_stage: compile, output_port: managed_assets}
      - name: compose
        capability_id: h3_av.compose
        target: {kind: default}
        inputs:
          - {name: preparation, producer_stage: prepare, output_port: preparation}
          - {name: compilation, producer_stage: compile, output_port: compilation}
          - {name: generated, producer_stage: run, output_port: vibecomfy_run}
          - {name: input_bundle, root_input: input_bundle}
      - name: verify
        capability_id: h3_av.verify
        target: {kind: default}
        inputs:
          - {name: preparation, producer_stage: prepare, output_port: preparation}
          - {name: compilation, producer_stage: compile, output_port: compilation}
          - {name: composition, producer_stage: compose, output_port: composition}
          - {name: candidate, producer_stage: compose, output_port: candidate}
          - {name: input_bundle, root_input: input_bundle}
      - name: finalize
        capability_id: h3_av.publication_finalizer
        target: {kind: default}
        inputs:
          - {name: verified_candidate, producer_stage: verify, output_port: verified_candidate}
    final_publication:
      stage: finalize
      verify_stage: verify
      verify_output_port: verified_candidate
      effect:
        effect_type: generation.publish_v1
        target_id: __PROJECT_ID__
        payload:
          version: 1
          modality: video
          generation_type: h3_av.publication_finalizer
          metadata:
            source_capability: h3_av.transform
          partial_success_policy: reject
          groups:
            - group_key: main
              selectors:
                - selector: main-0
                  ordinal: 0
                  variant_key: original
                  output_port: verified_candidate
                  required: true
