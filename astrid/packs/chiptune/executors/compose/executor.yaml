schema_version: 1
id: chiptune.compose
name: Chiptune Compose
kind: built_in
version: 1.0.0
short_description: "Compose a tempo-locked NES-style music cue with bar-snapped sections, a beat grid, and VO ducking."
description: >-
  Generates an original stereo 48 kHz cue from numpy alone: two pulse channels (12.5, 25 and 50 percent duty),
  a triangle bass and a noise drum channel. Sections of {start_s, end_s, energy, mood} snap to bar lines.
  Energy sets density (drums, arpeggio rate, octave); mood sets the chord progression and timbre. A seeded
  motif returns with variation. Outputs music.wav and beats.json (beats, downbeats, bars, per-section levels).
keywords: [chiptune, music, nes, 8-bit, soundtrack, bgm, procedural-audio, beat-grid]
inputs:
  - name: duration_s
    type: number
    required: true
    description: Exact cue length in seconds. The WAV holds round(duration_s * 48000) frames.
  - name: bpm
    type: integer
    required: false
    default: 132
    description: Tempo. Every event is locked to this grid.
  - name: key
    type: string
    required: false
    default: "A minor"
    description: Tonic and mode, for example "A minor", "C major" or "F# minor".
  - name: seed
    type: integer
    required: false
    default: 1
    description: Seed for the motif and drum noise. The same inputs and seed give identical bytes.
  - name: sections
    type: json
    required: true
    description: 'JSON array of {start_s, end_s, energy 0..1, mood: bright|tense|wistful|triumphant|silent, cadence_bars 0..8}. Edges are exact; each section starts its own bar grid. Pass a JSON string.'
  - name: hits
    type: json
    required: false
    description: JSON array of accent times in seconds (stabs on the chord sounding at that moment), or {t, kind} objects where kind is stab or thud.
  - name: duck
    type: json
    required: false
    description: JSON array of {start_s, end_s, gain_db} dips for explicit ducking.
  - name: vo_mask
    type: json
    required: false
    description: JSON array of [start_s, end_s] speech spans. The bed dips by duck_db (120 ms in, 300 ms out); a gap of 0.6 s or more brings it back to full.
  - name: duck_db
    type: number
    required: false
    default: -10
    description: Gain in dB applied under vo_mask spans and as the default for duck items.
  - name: master_db
    type: number
    required: false
    default: -16
    description: RMS target in dBFS (a simple LUFS-like proxy). The peak ceiling of -1.05 dBFS wins if they conflict.
  - name: style
    type: string
    required: false
    default: nes
    description: Synthesis style. Only nes is available.
outputs:
  - name: music
    type: file
    path_template: "{out}/music.wav"
    artifact_type: audio
    description: 48 kHz stereo 16-bit WAV with slight stereo spread between the pulse channels.
  - name: beats
    type: file
    path_template: "{out}/beats.json"
    artifact_type: null
    description: "JSON {bpm, beats, downbeats, bars (4-bar phrase starts), sections[]} for snapping cuts."
command:
  argv:
    - "{python_exec}"
    - "-m"
    - astrid.packs.chiptune.executors.compose.run
    - "--duration-s"
    - "{duration_s}"
    - "--bpm"
    - "{bpm}"
    - "--key"
    - "{key}"
    - "--seed"
    - "{seed}"
    - "--sections"
    - "{sections}"
    - "--duck-db"
    - "{duck_db}"
    - "--master-db"
    - "{master_db}"
    - "--style"
    - "{style}"
    - "--out"
    - "{out}"
  input_args:
    - input: hits
      flag: "--hits"
      optional: true
    - input: duck
      flag: "--duck"
      optional: true
    - input: vo_mask
      flag: "--vo-mask"
      optional: true
cache:
  mode: none
isolation:
  mode: subprocess
  network: false
metadata:
  runtime_entrypoint: main
  runtime_file: run.py
  runtime_module: astrid.packs.chiptune.executors.compose.run
  output_result_manifest: true
