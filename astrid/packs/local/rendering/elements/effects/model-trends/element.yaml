      "height": {"type": "number"},
      "padding": {"type": ["number", "string"]},
      "borderRadius": {"type": ["number", "string"]},
      "background": {"type": "string"},
      "border": {"type": "string"},
      "backdropFilter": {"type": "string"},
      "boxShadow": {"type": "string"},
      "accent": {"type": "string"}
    }
  },
