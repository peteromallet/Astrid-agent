{
  "schema_version": 1,
  "id": "model-trends",
  "kind": "effect",
  "pack_id": "local",
  "short_description": "Animated stacked-area chart of model-family share-of-conversation, driven by Remotion frame.",
  "description": "Local-pack ModelTrends overlay for /1m-style 'Models Come and Go' visualization. Renders a stacked-area chart (sd, animatediff, flux, wan, cogvideo, hunyuan, ltx) plus a cumulative-messages counter. Animation is driven entirely by useCurrentFrame() — Remotion controls timing, no DOM animation hooks. Chart and dataset are baked-in (sample WRAPPED_DATA from constants.ts). Sized for a corner overlay on a 1920x1080 video.",
  "keywords": ["chart", "trends", "stacked-area", "wrapped", "models", "overlay"],
  "metadata": {
    "label": "Model Trends Chart",
    "description": "Hand-rolled SVG stacked-area chart for the 'Models Come and Go' overlay. Recharts is not bundled in this Remotion project, so the area paths, axes and grid are computed inline from the same MODEL_COLORS / normalizeData / formatMonth helpers as the website component.",
    "whenToUse": "Drop into a 540x420 corner of a 1920x1080 timeline as a clipType: 'model-trends' clip. Animation maps the dataset frames onto the clip's playback duration. Configure size/anchor/styling via params (anchor, offsetX, offsetY, width, height, padding, borderRadius, background, accent)."
  },
  "defaults": {
    "anchor": "top-right",
    "offsetX": 60,
    "offsetY": 60,
    "width": 540,
    "height": 420,
    "padding": "20px",
    "borderRadius": "14px",
    "background": "rgba(8, 8, 14, 0.86)",
    "accent": "#9F1C1C"
  },
  "schema": {
    "type": "object",
    "additionalProperties": true,
    "properties": {
