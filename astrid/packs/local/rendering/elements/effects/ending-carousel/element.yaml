schema_version: 1
id: ending-carousel
kind: effect
pack_id: local
short_description: Image carousel insert that flies cards through, picks one, and lays them onto a timeline.
description: Renders the base shot plate full-screen, then plays a four-phase carousel over the middle band (fly-through, pick with amber glow, lay onto an amber timeline track, zoom out). Phase timing is relative to clip duration. Cards and plate resolve through params.__astridAssets.
keywords:
  - carousel
  - timeline
  - insert
  - astrid-intro
metadata:
  label: Ending Carousel
  whenToUse: Use as an fx-track overlay clip above its base shot when a motion insert must render inside the same composition as the plate, never as a separate keyed overlay.
  clipTypeAliases:
    - ending-carousel
defaults:
  duration: 9.193
schema:
  type: object
  additionalProperties: true
  properties: {}
assets:
  plate: assets/plate.mp4
  card0: assets/card-0.png
  card1: assets/card-1.png
  card2: assets/card-2.png
  card3: assets/card-3.png
  card4: assets/card-4.png
  card5: assets/card-5.png
  card6: assets/card-6.png
  card7: assets/card-7.png
