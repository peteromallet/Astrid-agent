schema_version: 1
id: scrolling-guide
kind: effect
pack_id: local
short_description: Transparent orange and cream scrolling guide for the video-making workflow.
description: A reusable Remotion overlay that keeps the authored composition centered and scrolls concise Astrid workflow guidance inside a right-hand document panel. The left side remains transparent for a separate character or source clip.
keywords:
  - guide
  - scroll
  - workflow
  - review
  - document
  - overlay
metadata:
  label: Scrolling Video Guide
  whenToUse: Use over a full-frame plate when a character on the left gestures toward a readable, scrolling workflow guide on the right. Stage the character as a separate managed media clip; this effect reserves no caption-safe area.
  clipTypeAliases:
    - scrolling-guide
defaults:
  side: right
  heading: MAKING VIDEOS
  subheading: A SMALL GUIDE TO THE REVIEW LOOP
  scrollStart: 0
  scrollEnd: 440
schema:
  type: object
  additionalProperties: true
  properties:
    side:
      type: string
      enum: [left, right]
    heading:
      type: string
    subheading:
      type: string
    scrollStart:
      type: number
      minimum: 0
    scrollEnd:
      type: number
      minimum: 0
    sections:
      type: array
      items:
        type: object
        additionalProperties: false
        properties:
          number: {type: string}
          heading: {type: string}
          lines:
            type: array
            items: {type: string}
        required: [number, heading, lines]
