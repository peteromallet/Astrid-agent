schema_version: 1
id: end-spanning-layer
kind: effect
pack_id: local
short_description: Flexible amber workflow timeline with real moving output and keyframe references.
description: Transparent Remotion overlay for the ending workflow. The clip-local sequence adapts to caller supplied phase durations for material preparation, PowerPoint words and timing, separate anchor/keyframe references, and a live workflow review. It reorders the supplied timeline cards, highlights the selected segment, and plays the managed source video for that segment. Phase timing and timeline data are supplied through clip params so narration revisions do not require a component change.
keywords:
  - timeline
  - overlay
  - insert
  - astrid-intro
metadata:
  label: Ending Spanning Layer
  whenToUse: Use as the ending fx-track overlay when a continuous amber workflow visualization should span the narration; pass phaseDurations, timelineSegments, and the source video asset on the effect clip.
  clipTypeAliases:
    - end-spanning-layer
defaults: {}
schema:
  type: object
  additionalProperties: true
  properties:
    phaseDurations:
      type: object
      description: Positive clip-local seconds for prep, iteration, anchors, and workflow.
      properties:
        prep: {type: number, exclusiveMinimum: 0}
        iteration: {type: number, exclusiveMinimum: 0}
        anchors: {type: number, exclusiveMinimum: 0}
        workflow: {type: number, exclusiveMinimum: 0}
    prepSeconds: {type: number, exclusiveMinimum: 0}
    iterationSeconds: {type: number, exclusiveMinimum: 0}
    anchorsSeconds: {type: number, exclusiveMinimum: 0}
    workflowSeconds: {type: number, exclusiveMinimum: 0}
    prepSourceStart: {type: number, minimum: 0}
    prepSourceEnd: {type: number, exclusiveMinimum: 0}
    prepSourceSpeed: {type: number, exclusiveMinimum: 0}
    selectedSegmentId: {type: string}
    selectedSegmentIndex: {type: integer, minimum: 0}
    timelineSegments:
      type: array
      description: Ordered source timeline sections; start and end are seconds in the managed source video.
      items:
        type: object
        required: [start, end, label, title]
        properties:
          id: {type: string}
          start: {type: number, minimum: 0}
          end: {type: number, exclusiveMinimum: 0}
          sourceStart: {type: number, minimum: 0}
          sourceEnd: {type: number, exclusiveMinimum: 0}
          speed: {type: number, exclusiveMinimum: 0}
          label: {type: string}
          title: {type: string}
    headings:
      type: object
      description: Optional short headings for the four visual phases.
      properties:
        prep: {type: string}
        iteration: {type: string}
        anchors: {type: string}
        workflow: {type: string}
assets:
  card0: assets/card-0.png
  card1: assets/card-1.png
  card2: assets/card-2.png
  card3: assets/card-3.png
  card4: assets/card-4.png
  card5: assets/card-5.png
