schema_version: 1
id: sliding-media
kind: effect
pack_id: local
short_description: Full-screen media clip with slide-in/out motion.
description: Renders a video or image asset full-screen and applies clip-level fade/slide effects (fade_in, fade_out, slide_in_x, slide_out_x).
keywords:
  - media
  - slide
  - transition
metadata:
  label: Sliding Media
  whenToUse: Use for full-screen media clips that should enter from the left and exit to the right.
  clipTypeAliases:
    - sliding-media
defaults:
  duration: 2
schema:
  type: object
  additionalProperties: true
  properties:
    objectFit:
      type: string
      enum: [cover, contain]
