schema_version: 1
id: frame-overlay
kind: effect
pack_id: local
short_description: Full-frame tight amber border overlay.
description: Renders the canonical tight-frame borderless overlay fullscreen over everything below. One clip spans the whole timeline on the top frame track; hold must equal total duration and is recomputed whenever VO retimes.
keywords:
  - frame
  - border
  - overlay
  - astrid-intro
metadata:
  label: Frame Overlay
  whenToUse: Use as the single full-duration clip on the top frame track so the border renders inside the composition instead of a post ffmpeg pass.
  clipTypeAliases:
    - frame-overlay
defaults:
  duration: 115.699
schema:
  type: object
  additionalProperties: true
  properties: {}
assets:
  frame: assets/frame.png
