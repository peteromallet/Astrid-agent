<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dataset Review</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>Dataset Review</h1>
        <p id="summary">Loading...</p>
      </div>
      <div class="controls" aria-label="Review controls">
        <label>
          Status
          <select id="statusFilter">
            <option value="">All</option>
            <option value="pending">Pending</option>
            <option value="accepted">Accepted</option>
            <option value="rejected">Rejected</option>
          </select>
        </label>
        <label>
          Sample
          <select id="sampledFilter">
            <option value="">All</option>
            <option value="true">Sampled</option>
            <option value="false">Unsampled</option>
          </select>
        </label>
        <button id="prevPage" type="button">Previous</button>
        <button id="nextPage" type="button">Next</button>
        <label>
          Reason
          <select id="batchRejectReason">
            <option value="low_quality">low_quality</option>
            <option value="watermark">watermark</option>
            <option value="wrong_scene">wrong_scene</option>
            <option value="wrong_character">wrong_character</option>
            <option value="bad_motion">bad_motion</option>
            <option value="wrong_content">wrong_content</option>
            <option value="rights_concern">rights_concern</option>
            <option value="other">other</option>
          </select>
        </label>
        <button id="acceptVisible" type="button">Accept visible</button>
        <button id="rejectVisible" type="button">Reject visible</button>
        <button id="acceptFiltered" type="button">Accept filtered</button>
        <button id="rejectFiltered" type="button">Reject filtered</button>
        <button id="save" type="button">Save</button>
        <button id="submit" type="button">Submit</button>
      </div>
    </header>

    <main class="layout">
      <aside class="rail">
        <div id="conflictBanner" class="conflict" hidden>
          <span>State changed</span>
          <button id="reapplyLocal" type="button">Reapply</button>
          <button id="discardLocal" type="button">Discard</button>
        </div>
        <div id="pageMeta" class="page-meta"></div>
        <ol id="itemList" class="item-list" aria-label="Visible review items"></ol>
      </aside>
      <section id="detail" class="detail" aria-live="polite"></section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
