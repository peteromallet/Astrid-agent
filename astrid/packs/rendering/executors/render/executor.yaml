{
  "schema_version": 1,
  "cache": {
    "always_run": false,
    "mode": "sentinel",
    "per_brief": true,
    "sentinels": [
      "hype.mp4"
    ]
  },
  "clip_kinds_supported": [
    "video",
    "image",
    "audio",
    "text",
    "effect"
  ],
  "conditions": [],
  "command": {
    "argv": [
      "{python_exec}",
      "-m",
      "astrid.packs.rendering.executors.render.run",
      "--timeline",
      "{timeline}",
      "--out",
      "{out}/{output_name}"
    ],
    "input_args": [
      {
        "input": "assets_registry",
        "flag": "--assets",
        "optional": true,
        "before": "--out"
      },
      {
        "input": "theme",
        "flag": "--theme",
        "optional": true
      },
      {
        "input": "selector",
        "flag": "--selector",
        "optional": true
      },
      {
        "input": "backend_config",
        "flag": "--backend-config",
        "optional": true
      },
      {
        "input": "profile",
        "flag": "--profile",
        "optional": true
      },
      {
        "input": "output_name",
        "flag": "--output-name",
        "optional": true
      },
      {
        "input": "keep_previous_renders",
        "flag": "--keep-previous-renders",
        "optional": true
      },
      {
        "input": "timeline_authority",
        "flag": "--timeline-authority",
        "optional": true
      },
      {
        "input": "materialized_root",
        "flag": "--materialized-root",
        "optional": true
      },
      {
        "input": "materialized_objects",
        "flag": "--materialized-objects",
        "optional": true
      },
      {
        "input": "review",
        "flag": "--review",
        "optional": true
      },
      {
        "input": "review_context",
        "flag": "--review-context",
        "optional": true
      },
      {
        "input": "delivery_audio",
        "flag": "--delivery-audio",
        "optional": true
      }
    ]
  },
  "description": "Render the brief timeline through the selected backend. Opaque output defaults to MP4; explicitly alpha-stamped layers may publish ProRes 4444 MOV.",
  "graph": {
    "consumes": [],
    "depends_on": [
      "editorial.transcribe",
      "editorial.scenes",
      "editorial.quality_zones",
      "editorial.shots",
      "editorial.triage",
      "understanding.scene_describe",
      "editorial.quote_scout",
      "training.pool_build",
      "training.pool_merge",
      "editorial.arrange",
      "video_editing.cut",
      "editorial.refine"
    ],
    "provides": [
      "rendered_video"
    ]
  },
  "id": "rendering.render",
  "inputs": [
    {
      "description": "Attempt-local runtime materialization consumed by the path-oriented renderer host; callers must supply timeline_ref instead of a source path.",
      "name": "timeline",
      "required": true,
      "type": "file",
      "artifact_type": "timeline/document"
    },
    {
      "description": "Explicit canonical runtime timeline slug, UUID, or ULID.",
      "name": "timeline_ref",
      "required": true,
      "type": "string",
      "artifact_type": null
    },
    {
      "description": "Optional CAS pin for timeline_ref mode; stale values fail before run admission.",
      "name": "expected_version",
      "required": false,
      "type": "integer",
      "artifact_type": null
    },
    {
      "description": "Kernel-resolved timeline identity and content hashes stamped into render provenance.",
      "name": "timeline_authority",
      "required": false,
      "type": "json",
      "artifact_type": null
    },
    {
      "description": "",
      "name": "assets_registry",
      "required": false,
      "type": "file",
      "artifact_type": "timeline/assets"
    },
    {
      "description": "",
      "name": "theme",
      "required": false,
      "type": "file",
      "artifact_type": null
    },
    {
      "description": "Qualified renderer id: rendering.remotion, rendering.ffmpeg, or rendering.threejs.",
      "name": "selector",
      "required": false,
      "type": "string",
      "artifact_type": null
    },
    {
      "description": "JSON object keyed by qualified backend id with per-backend configuration. The facade forwards only the selected implementation's namespace.",
      "name": "backend_config",
      "required": false,
      "type": "json",
      "artifact_type": null
    },
    {
      "description": "Requested render profile mapping. The selected backend validates it against the media it can actually produce.",
      "name": "profile",
      "required": false,
      "type": "json",
      "artifact_type": null
    },
    {
      "description": "Plain output filename with no separators or traversal. Defaults to hype.mp4. A timeline stamped metadata.astrid_layer.alpha=true may request .mov for ProRes 4444/PCM output; an explicit profile must match that alpha mux.",
      "name": "output_name",
      "required": false,
      "type": "string",
      "artifact_type": null,
      "default": "hype.mp4"
    },
    {
      "description": "Preserve previous provenance-linked hype.mp4 outputs for the same timeline.",
      "name": "keep_previous_renders",
      "required": false,
      "type": "boolean",
      "artifact_type": null
    },
    {
      "description": "Host-owned attempt-local managed object root.",
      "name": "materialized_root",
      "required": false,
      "type": "file",
      "artifact_type": null
    },
    {
      "description": "Host-owned object-id to attempt-local path handoff.",
      "name": "materialized_objects",
      "required": false,
      "type": "json",
      "artifact_type": null
    },
    {
      "name": "review",
      "type": "boolean",
      "required": false,
      "artifact_type": null,
      "description": "Render-only shot-name and timeline-clock overlay."
    },
    {
      "name": "review_context",
      "type": "json",
      "required": false,
      "artifact_type": null,
      "description": "Admission-owned snapshot of registered shot names and timeline ranges."
    },
    {
      "name": "delivery_audio",
      "type": "json",
      "required": false,
      "artifact_type": null,
      "description": "Opt-in delivery audio master, e.g. {\"lufs\": -14, \"true_peak\": -1}: loudnorm to the LUFS target with a true-peak ceiling on the final mix; video is stream-copied. Omit for no mastering."
    },
    {
      "name": "speech_annotations",
      "type": "json",
      "required": false,
      "artifact_type": null,
      "description": "Explicit verified speech annotations retained in the immutable render envelope."
    },
    {
      "name": "speech_occurrences",
      "type": "json",
      "required": false,
      "artifact_type": null,
      "description": "Explicit render occurrences linked to verified speech annotations."
    },
    {
      "name": "source_audio_digest",
      "type": "string",
      "required": false,
      "artifact_type": null,
      "description": "Hash-bound source media digest for frozen speech projection."
    },
    {
      "name": "transcript_digest",
      "type": "string",
      "required": false,
      "artifact_type": null,
      "description": "Hash-bound transcript digest for frozen speech projection."
    },
    {
      "name": "annotation_digest",
      "type": "string",
      "required": false,
      "artifact_type": null,
      "description": "Hash-bound annotation-source digest for frozen speech projection."
    },
    {
      "name": "correction_version",
      "type": "integer",
      "required": false,
      "artifact_type": null,
      "description": "Frozen correction revision for the verified speech annotation set."
    },
    {
      "name": "timing_method",
      "type": "string",
      "required": false,
      "artifact_type": null,
      "description": "Frozen timing method for explicit speech projection."
    },
    {
      "name": "speech_coverage",
      "type": "json",
      "required": false,
      "artifact_type": null,
      "description": "Frozen speech projection coverage summary."
    }
  ],
  "isolation": {
    "binaries": [],
    "mode": "subprocess",
    "network": false,
    "requirements": []
  },
  "keywords": [
    "render",
    "video",
    "timeline",
    "hype",
    "mp4",
    "backend"
  ],
  "kind": "built_in",
  "metadata": {
    "auto_forward_skip": [
      "timeline_ref",
      "expected_version",
      "speech_annotations",
      "speech_occurrences",
      "source_audio_digest",
      "transcript_digest",
      "annotation_digest",
      "correction_version",
      "timing_method",
      "speech_coverage"
    ],
    "requires_remotion": true,
    "requires_timeline": false,
    "command_builder": "astrid.packs.video_editing.orchestrators.hype.run.build_pool_steps",
    "pipeline_step": "render",
    "pipeline_step_order": 12,
    "runtime_entrypoint": "main",
    "runtime_file": "run.py",
    "runtime_module": "astrid.packs.rendering.executors.render.run"
  },
  "name": "Render",
  "outputs": [
    {
      "description": "",
      "mode": "create_or_replace",
      "name": "video",
      "path_template": "{out}/{output_name}",
      "type": "file",
      "artifact_type": "clip/visual"
    },
    {
      "description": "Render provenance sidecar for the video output.",
      "mode": "create_or_replace",
      "name": "provenance",
      "path_template": "{out}/{output_name}.provenance.json",
      "type": "file",
      "artifact_type": "metadata/provenance"
    }
  ],
  "pipeline_requirements": [
    "timeline",
    "assets",
    "theme"
  ],
  "short_description": "Render a hype timeline to opaque MP4 or explicitly stamped alpha MOV through the selected backend.",
  "version": "1.0"
}
