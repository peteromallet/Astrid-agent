{
  "schema_version": 1,
  "id": "rendering.timeline_visualize",
  "name": "Timeline Visualize",
  "kind": "built_in",
  "version": "1.0",
  "short_description": "Private backend for composed timeline visualization.",
  "description": "Internal managed executor used by the canonical timelines.visualize operation to inspect an exact admitted render and produce paired filmstrip, source-decoding, waveform, or playback evidence. This backend is not a public capability and must not be invoked directly.",
  "keywords": [
    "timeline",
    "visualize",
    "evidence",
    "agent",
    "png"
  ],
  "inputs": [
    {
      "name": "project_slug",
      "type": "string",
      "required": false,
      "description": "Owning Astrid project slug. In a project-scoped SDK invocation this is derived from project=<slug>; pass it for a standalone runner invocation."
    },
    {
      "name": "timeline_slug",
      "type": "string",
      "required": false,
      "description": "Managed timeline reference by slug, UUID, or ULID; omission selects the project default."
    },
    {
      "name": "shot",
      "type": "string",
      "required": false,
      "description": "Authored pinnedShotGroups[].shotId to focus."
    },
    {
      "name": "range",
      "type": "string",
      "required": false,
      "description": "Closed-open START..END window; times are seconds or [HH:]MM:SS[.fff]."
    },
    {
      "name": "at",
      "type": "string",
      "required": false,
      "description": "Timestamp to inspect, in seconds or [HH:]MM:SS[.fff]."
    },
    {
      "name": "clip",
      "type": "string",
      "required": false,
      "description": "Authored clip id to focus."
    },
    {
      "name": "asset",
      "type": "string",
      "required": false,
      "description": "Canonical asset key to inspect with every timeline use."
    },
    {
      "name": "show",
      "type": "string",
      "required": false,
      "description": "Add synchronized components (repeatable/comma-separated): output, text, audio, or inputs."
    },
    {
      "name": "hide",
      "type": "string",
      "required": false,
      "description": "Hide synchronized components (repeatable/comma-separated)."
    },
    {
      "name": "track",
      "type": "string",
      "required": false,
      "description": "Restrict input lanes to one or more track ids."
    },
    {
      "name": "detail",
      "type": "boolean",
      "required": false,
      "default": false,
      "description": "Request detail treatment for the shared current selection."
    },
    {
      "name": "context",
      "type": "number",
      "required": false,
      "default": 3.0,
      "description": "Symmetric context seconds for clip or timestamp focus."
    },
    {
      "name": "neighbors",
      "type": "integer",
      "required": false,
      "default": 0,
      "description": "Previous and next clips retained on a focused clip's track."
    },
    {
      "name": "formats",
      "type": "string",
      "required": false,
      "description": "Optional presentation format list. Choices are png or md (default png,md). Core machine artifacts are always written."
    },
    {
      "name": "rendered_video",
      "type": "file",
      "required": false,
      "artifact_type": null,
      "description": "Host-injected attempt-local rendered video; callers select it with render_run."
    },
    {
      "name": "materialized_root",
      "type": "file",
      "required": false,
      "artifact_type": null,
      "description": "Host-owned attempt-local managed object root."
    },
    {
      "name": "materialized_objects",
      "type": "json",
      "required": false,
      "artifact_type": null,
      "description": "Host-owned object-id to attempt-local path handoff."
    },
    {
      "name": "transcript.json",
      "type": "file",
      "required": false,
      "artifact_type": null,
      "description": "Host-staged bytes for the hash-bound config.app.transcript declaration; callers cannot provide this path."
    },
    {
      "name": "view",
      "type": "string",
      "required": false,
      "description": "Presentation: the paired rendered filmstrip as static PNG/Markdown/JSON evidence (the only supported view).",
      "default": "filmstrip"
    },
    {
      "name": "sample",
      "type": "string",
      "required": false,
      "description": "Filmstrip sampling: interval (default), clips (picture clips), cuts (cut boundaries), or shots (authored story beats)."
    },
    {
      "name": "every",
      "type": "number",
      "required": false,
      "description": "Filmstrip interval in seconds (default 0.5 when every_frames is absent)."
    },
    {
      "name": "every_frames",
      "type": "integer",
      "required": false,
      "description": "Positive integer rendered frame interval, mutually exclusive with every."
    },
    {
      "name": "include_cuts",
      "type": "boolean",
      "required": false,
      "default": false,
      "description": "For interval sampling, explicitly include visual cut-neighbor frames."
    },
    {
      "name": "render_run",
      "type": "string",
      "required": false,
      "description": "Exact successful rendering.render run id, or latest; filmstrip defaults to latest matching timeline render."
    },
    {
      "name": "include_media",
      "type": "boolean",
      "required": false,
      "default": false,
      "description": "Explicitly include a relative, digest-verified copy of the admitted rendered video for offline playback."
    },
    {
      "name": "columns",
      "type": "integer",
      "required": false,
      "description": "Filmstrip contact sheet columns, default 5."
    },
    {
      "name": "page_size",
      "type": "integer",
      "required": false,
      "description": "Filmstrip static page card count, default 50."
    },
    {
      "name": "resolution",
      "type": "string",
      "required": false,
      "description": "Optional exact filmstrip frame resolution WIDTHxHEIGHT; recorded separately and applied by the frame extractor."
    },
    {
      "name": "filmstrip_authority",
      "type": "string",
      "required": false,
      "description": "Internal SDK-injected trusted filmstrip snapshot manifest. Public caller values are rejected."
    }
  ],
  "outputs": [
    {
      "name": "pack_root",
      "type": "directory",
      "mode": "create_or_replace",
      "path_template": "{out}/filmstrip-view",
      "artifact_type": "evidence/timeline-visualization",
      "description": "Browsable deterministic evidence-pack directory. Kernel SDK invocations materialize this as a durable, non-authoritative project cache; use manifest_path for navigation authority."
    },
    {
      "name": "manifest_path",
      "type": "file",
      "mode": "create_or_replace",
      "path_template": "{out}/filmstrip-view/manifest.json",
      "artifact_type": "metadata/result-manifest",
      "description": "Durable managed result manifest and authoritative agent navigation handle."
    },
    {
      "name": "filmstrip_bundle",
      "type": "file",
      "mode": "create_or_replace",
      "path_template": "{out}/filmstrip-bundle.zip",
      "artifact_type": "archive/filmstrip",
      "description": "Rendered filmstrip delivery artifact; produced for view=filmstrip."
    },
    {
      "name": "filmstrip_manifest",
      "type": "file",
      "mode": "create_or_replace",
      "path_template": "{out}/filmstrip-view/manifest.json",
      "artifact_type": "metadata/result-manifest",
      "description": "Rendered filmstrip delivery artifact; produced for view=filmstrip."
    }
  ],
  "command": {
    "argv": [
      "{python_exec}",
      "-m",
      "astrid.packs.rendering.executors.timeline_visualize.run",
      "--out",
      "{out}"
    ],
    "input_args": [
      {
        "input": "formats",
        "flag": "--format",
        "repeatable": true,
        "optional": true
      },
      {
        "input": "materialized_root",
        "flag": "--materialized-root",
        "optional": true
      },
      {
        "input": "materialized_objects",
        "flag": "--materialized-objects",
        "optional": true
      },
      {
        "input": "transcript.json",
        "flag": "--transcript-file",
        "optional": true
      },
      {
        "input": "filmstrip_authority",
        "flag": "--filmstrip-authority",
        "optional": true
      },
      {
        "input": "project_slug",
        "flag": "--project-slug",
        "optional": true
      },
      {
        "input": "timeline_slug",
        "flag": "--timeline-slug",
        "optional": true
      },
      {
        "input": "shot",
        "flag": "--shot",
        "optional": true
      },
      {
        "input": "range",
        "flag": "--range",
        "optional": true
      },
      {
        "input": "at",
        "flag": "--at",
        "optional": true
      },
      {
        "input": "clip",
        "flag": "--clip",
        "optional": true
      },
      {
        "input": "asset",
        "flag": "--asset",
        "optional": true
      },
      {
        "input": "show",
        "flag": "--show",
        "repeatable": true,
        "optional": true
      },
      {
        "input": "hide",
        "flag": "--hide",
        "repeatable": true,
        "optional": true
      },
      {
        "input": "track",
        "flag": "--track",
        "repeatable": true,
        "optional": true
      },
      {
        "input": "detail",
        "flag": "--detail",
        "optional": true
      },
      {
        "input": "context",
        "flag": "--context",
        "optional": true
      },
      {
        "input": "neighbors",
        "flag": "--neighbors",
        "optional": true
      },
      {
        "input": "rendered_video",
        "flag": "--rendered-video",
        "optional": true
      },
      {
        "input": "view",
        "flag": "--view",
        "optional": true
      },
      {
        "input": "sample",
        "flag": "--sample",
        "optional": true
      },
      {
        "input": "every",
        "flag": "--every",
        "optional": true
      },
      {
        "input": "every_frames",
        "flag": "--every-frames",
        "optional": true
      },
      {
        "input": "include_cuts",
        "flag": "--include-cuts",
        "optional": true
      },
      {
        "input": "render_run",
        "flag": "--render-run",
        "optional": true
      },
      {
        "input": "columns",
        "flag": "--columns",
        "optional": true
      },
      {
        "input": "page_size",
        "flag": "--page-size",
        "optional": true
      },
      {
        "input": "resolution",
        "flag": "--resolution",
        "optional": true
      },
      {
        "input": "include_media",
        "flag": "--include-media",
        "optional": true
      }
    ]
  },
  "cache": {
    "mode": "none"
  },
  "conditions": [],
  "graph": {
    "consumes": [
      "runtime_timeline_documents"
    ],
    "depends_on": [],
    "provides": [
      "timeline_visualization_evidence"
    ]
  },
  "isolation": {
    "mode": "subprocess",
    "network": false,
    "binaries": [
      "ffmpeg"
    ],
    "requirements": []
  },
  "metadata": {
    "visibility": "internal",
    "runtime_entrypoint": "run_sdk",
    "runtime_file": "run.py",
    "runtime_module": "astrid.packs.rendering.executors.timeline_visualize.run",
    "output_result_manifest": true,
    "requires_timeline": false,
    "run_metadata": {
      "evidence": true
    }
  }
}
