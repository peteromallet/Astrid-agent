schema_version: 2
id: rendering
name: Astrid Rendering
version: 1.0.0
status: active
domain: media
stability: stable
support: core
visibility: visible
permissions:
  - id: subprocess
    reason: Runs Remotion render process and ffmpeg sprite processing.
  - id: project_files
    reason: Reads timeline, asset, and theme files; writes rendered video.
  - id: network
    reason: Sprite sheet executor calls OpenAI GPT Image API.
description: Author, inspect, preview, and render runtime-owned timelines; visualize them as deterministic evidence packs; generate GPT-Image sprite sheets; and supply render-time animation/transition/effect elements.
keywords:
- render
- remotion
- video
- mp4
- timeline
- visualize
- evidence
- sprite-sheet
- gpt-image
- animation
capabilities:
- render_timeline
- generate_sprite_sheet
- scaffold_html_canvas_effect
agent:
  purpose: Choose this pack for runtime-owned timeline authoring and inspection, candidate preview/publication, finished video rendering, deterministic visual evidence, GPT Image sprite sheets, or canvas/WebGL post-processing effects.
  do_not_use_for: Publishing rendered output to external services.
  normal_entrypoints:
  - rendering.render
  - rendering.sprite_sheet
content:
  executors: executors
  elements: elements
extensions:
  rendering:
    renderers:
      - backends/remotion/renderer.yaml
      - backends/ffmpeg/renderer.yaml
      - backends/threejs/renderer.yaml
    finalizers:
      - finalizers/ffmpeg/finalizer.yaml
      - finalizers/compositor/finalizer.yaml
documentation:
  kind: skill
  path: skill/SKILL.md
