schema_version: 1
id: rendering
name: Astrid Rendering
version: 1.0.0
origin: builtin
install_tier: core
pack_type: capability
domain: media
stability: stable
support: core
visibility: visible
permissions:
  - id: subprocess
    reason: Runs Remotion render process and ffmpeg sprite processing.
  - id: project_files
    reason: Reads timeline, asset, and theme files; writes rendered video.
  - id: network
    reason: Sprite sheet executor calls OpenAI GPT Image API.
description: Render timelines to video, visualize event logs as deterministic evidence packs, generate GPT-Image sprite sheets, and supply render-time animation/transition/effect elements.
keywords:
- render
- remotion
- video
- mp4
- timeline
- visualize
- evidence
- sprite-sheet
- gpt-image
- animation
capabilities:
- render_timeline
- timeline_visualize
- generate_sprite_sheet
- scaffold_html_canvas_effect
agent:
  purpose: Choose this pack to turn a brief timeline into a finished video (hype.mp4), inspect managed timeline event logs as deterministic evidence, generate/slice GPT Image sprite sheets, or wrap content in a canvas/WebGL post-processing effect.
  do_not_use_for: Publishing rendered output to external services.
  normal_entrypoints:
  - rendering.render
  - rendering.timeline_visualize
  - rendering.sprite_sheet
content:
  executors: executors
  elements: elements
extensions:
  rendering:
    renderers:
      - backends/remotion/renderer.yaml
      - backends/ffmpeg/renderer.yaml
      - backends/threejs/renderer.yaml
    planners:
      - planners/legacy_hybrid/planner.yaml
      - planners/threejs_hybrid/planner.yaml
      - planners/layer_stack/planner.yaml
    finalizers:
      - finalizers/ffmpeg/finalizer.yaml
      - finalizers/compositor/finalizer.yaml
aliases:
- kind: executor
  alias: builtin.render
  canonical_id: rendering.render
  deprecated: true
  deprecation_message: Moved to rendering.render
- kind: executor
  alias: builtin.html_canvas_effect
  canonical_id: rendering.html_canvas_effect
  deprecated: true
  deprecation_message: Moved to rendering.html_canvas_effect
- kind: executor
  alias: builtin.sprite_sheet
  canonical_id: rendering.sprite_sheet
  deprecated: true
  deprecation_message: Moved to rendering.sprite_sheet
