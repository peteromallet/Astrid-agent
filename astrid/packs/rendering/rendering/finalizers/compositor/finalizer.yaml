schema_version: 1
id: rendering.ffmpeg-compositor
name: FFmpeg Layer Compositor
version: 1.0.0
protocol_version: 1
command:
  - python3
  - run.py
operations:
  - finalize
  - support
description: Composite overlapping z-layer segments bottom-to-top into one timeline-length video.
capabilities:
  containers:
    - mp4
  audio_ownership:
    - rendered
    - none
  features:
    layer_compositing: true
    straight_alpha: true
    short_layer_padding: true
required_permissions:
  - project_files
  - subprocess
required_binaries:
  - ffmpeg
  - ffprobe
