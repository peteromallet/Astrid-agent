schema_version: 1
id: rendering.ffmpeg-finalizer
name: FFmpeg Segment Finalizer
version: 1.0.0
protocol_version: 1
command:
  - python3
  - run.py
operations:
  - finalize
  - support
description: Strictly preflight, normalize, and assemble rendered timeline segments with FFmpeg.
capabilities:
  containers:
    - mp4
  preserves_attachments: true
  audio_ownership:
    - rendered
    - passthrough
    - none
  features:
    strict_probe: true
    stream_copy: true
    profile_normalization: true
required_permissions:
  - project_files
  - subprocess
required_binaries:
  - ffmpeg
  - ffprobe
