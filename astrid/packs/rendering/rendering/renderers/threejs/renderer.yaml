schema_version: 1
id: rendering.threejs
name: Three.js Timeline Renderer
version: 1.0.0
protocol_version: 1
command: [python3, rendering/renderers/threejs/run.py]
operations: [support, render]
capabilities:
  clip_types: [text, media, com.reigh.astrid.liveScene]
  track_types: [visual, audio]
  supports_full_timeline: true
  supports_windows: true
  output_profiles: [video/mp4]
  audio_ownership: [rendered]
  features: {webgl: true, textured_text_planes: true, background_only: true, deterministic_frame_clock: true, capture_host: remotion, media_textures: false, effects: false, transitions: false, alpha_output: true}
required_permissions: [project_files, subprocess]
required_binaries: [node, npx, ffprobe]
timeout_seconds: 600
