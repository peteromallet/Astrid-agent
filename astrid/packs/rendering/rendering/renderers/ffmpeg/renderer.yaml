schema_version: 1
id: rendering.ffmpeg
name: FFmpeg Media Renderer
version: 1.1.0
protocol_version: 1
command:
  - python3
  - run.py
operations:
  - render
  - support
description: Render media, text overlays, and one canvas-sized transparent PNG overlay with FFmpeg.
capabilities:
  clip_types:
    - media
    - text
  track_types:
    - visual
    - audio
  features:
    media_only: false
    text_overlay: true
    fade_envelope: true
    stream_copy: true
    sequential_audio: true
    static_image_overlay: true
  supports_full_timeline: true
  supports_windows: false
  output_profiles:
    - video/mp4
  audio_ownership:
    - rendered
    - passthrough
    - none
required_permissions:
  - project_files
  - subprocess
required_binaries:
  - ffmpeg
  - ffprobe
