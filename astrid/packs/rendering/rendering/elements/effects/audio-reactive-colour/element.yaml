{
  "schema_version": 1,
  "id": "audio-reactive-colour",
  "kind": "effect",
  "pack_id": "rendering",
  "short_description": "Fill the frame with colours selected by frozen integer-frame markers.",
  "description": "A deterministic full-frame colour effect driven by approved clip-relative frame events. Rendering can specialize this exact contract to FFmpeg without changing timeline semantics.",
  "keywords": [
    "audio-reactive",
    "colour",
    "markers",
    "beats",
    "timeline",
    "ffmpeg"
  ],
  "metadata": {
    "label": "Audio-reactive colour",
    "description": "Selects the active full-frame colour from frozen frame events.",
    "whenToUse": "Use when approved musical or audio markers should drive hard full-frame colour changes.",
    "ffmpegAdapter": "audio-reactive-colour/v1"
  },
  "outputs": [
    {
      "name": "clip",
      "type": "clip",
      "artifact_type": "clip/visual",
      "description": "The rendered full-frame colour state."
    }
  ],
  "schema": {
    "type": "object",
    "additionalProperties": false,
    "required": [
      "initialColor",
      "events"
    ],
    "properties": {
      "schemaVersion": {
        "type": "integer",
        "enum": [
          1
        ]
      },
      "initialColor": {
        "type": "string",
        "pattern": "^#[0-9A-Fa-f]{6}$"
      },
      "events": {
        "type": "array",
        "items": {
          "type": "object",
          "additionalProperties": false,
          "required": [
            "frame",
            "color"
          ],
          "properties": {
            "id": {
              "type": "string",
              "minLength": 1
            },
            "frame": {
              "type": "integer",
              "minimum": 1
            },
            "color": {
              "type": "string",
              "pattern": "^#[0-9A-Fa-f]{6}$"
            }
          }
        }
      }
    }
  },
  "defaults": {
    "schemaVersion": 1,
    "initialColor": "#000000",
    "events": []
  },
  "dependencies": {
    "js_packages": [],
    "python_requirements": []
  },
  "runtime": {
    "adapter": "remotion"
  }
}
